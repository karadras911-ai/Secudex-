<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SECUDEX — Квантовый Катализатор 3D</title>
<meta name="description" content="SECUDEX — Интерактивный 3D процесс анализа договора четырьмя ИИ-техносферами">
<meta property="og:title" content="SECUDEX — Квантовый Катализатор 3D">
<meta property="og:description" content="SECUDEX — Интерактивный 3D процесс анализа договора четырьмя ИИ-техносферами">
<link rel="stylesheet" href="./src/ui/hud.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body data-stage="intro" data-threats="0" data-audio-track="intro">

<nav id="stage-ruler-wrap" aria-label="Шкала этапов процесса">
  <div class="ruler-bar">
    <div class="ruler-steps-viewport">
      <div class="ruler-track-bg" aria-hidden="true">
        <div class="ruler-track-fill" id="ruler-track-fill"></div>
      </div>
      <div class="ruler-steps" id="ruler-steps"></div>
    </div>
    <div class="ruler-right-actions">
      <div class="ruler-telemetry-badge" id="ruler-telemetry-badge">УГРОЗ: 0/5 • АНАЛИЗ: 0%</div>
      <button id="reset-btn" type="button">СБРОС</button>
    </div>
  </div>
  <div id="ruler-detail-popover" role="region" aria-live="polite" aria-label="Описание выбранного этапа">
    <div class="ruler-detail-head">
      <div class="ruler-detail-title-row">
        <span id="ruler-detail-title">Этап</span>
        <span id="ruler-detail-status">Сейчас</span>
      </div>
      <div class="ruler-detail-btns">
        <button id="ruler-jump-btn" type="button">Перейти к этапу</button>
        <button id="ruler-close-btn" type="button" aria-label="Закрыть описание этапа">✕</button>
      </div>
    </div>
    <div id="ruler-detail-body"></div>
  </div>
</nav>

<aside id="perf-diag-wrap" aria-label="Диагностика производительности 3D">
  <button id="perf-diag-btn" type="button" aria-expanded="false">
    <span class="perf-dot" aria-hidden="true"></span>
    <span id="perf-fps-pill">FPS: --</span>
  </button>
  <div id="perf-diag-panel" role="region" aria-label="Метрики WebGL">
    <div class="perf-row"><span>Профиль</span><strong id="perf-tier">--</strong></div>
    <div class="perf-row"><span>FPS</span><strong id="perf-fps">--</strong></div>
    <div class="perf-row"><span>Draw Calls</span><strong id="perf-calls">--</strong></div>
    <div class="perf-row"><span>Triangles</span><strong id="perf-tris">--</strong></div>
    <div class="perf-row"><span>Pixel Ratio</span><strong id="perf-dpr">--</strong></div>
  </div>
</aside>

<div id="iris-overlay"></div>
<div id="final-logo-screen">
  <canvas id="final-logo-canvas" width="1024" height="512"></canvas>
  <div id="final-subtitle">Глобальный анализ завершён • Система SECUDEX активна</div>
  <button id="final-replay-btn" type="button">ПОВТОРИТЬ СЦЕНУ</button>
</div>

<div id="bottom-dock-wrap">
  <button id="dock-toggle-btn" type="button" aria-expanded="true">Свернуть панель</button>
  <div id="bottom-dock">
    <div class="dock-primary-row">
      <button id="primary-action-btn" type="button">ЗАПУСТИТЬ АНАЛИЗ</button>
      <button id="pause-btn" type="button" disabled>Пауза скана</button>
      <button id="audio-drawer-btn" type="button" aria-expanded="false">Озвучка: Вкл</button>
    </div>

    <div class="slide-tabs" role="tablist" aria-label="Слайды анимации">
      <button class="slide-btn active" type="button" data-slide="0">1. Обзор</button>
      <button class="slide-btn" type="button" data-slide="1">2. Скан агентами</button>
      <button class="slide-btn" type="button" data-slide="2">3. Передача</button>
      <button class="slide-btn" type="button" data-slide="3">4. Вердикт и импульс</button>
    </div>

    <div id="audio-drawer">
      <div class="audio-status-bar">
        <span id="audio-active-label">Активная дорожка: 01. Введение и обзор пространства</span>
        <button id="audio-mute-btn" type="button" class="audio-mute-toggle">Звук: ВКЛ</button>
      </div>
      <div class="audio-slots">
        <div class="audio-slot" data-track-slot="intro">
          <span class="audio-slot-name" id="track-name-intro">01. Введение (слот)</span>
          <label>Файл<input type="file" accept="audio/*" data-track-upload="intro" /></label>
        </div>
        <div class="audio-slot" data-track-slot="scan">
          <span class="audio-slot-name" id="track-name-scan">02. Сканирование (слот)</span>
          <label>Файл<input type="file" accept="audio/*" data-track-upload="scan" /></label>
        </div>
        <div class="audio-slot" data-track-slot="transfer">
          <span class="audio-slot-name" id="track-name-transfer">03. Передача в сферу (слот)</span>
          <label>Файл<input type="file" accept="audio/*" data-track-upload="transfer" /></label>
        </div>
        <div class="audio-slot" data-track-slot="finale">
          <span class="audio-slot-name" id="track-name-finale">04. Вердикт и финал (слот)</span>
          <label>Файл<input type="file" accept="audio/*" data-track-upload="finale" /></label>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="canvas-container" data-testid="secudex-3d-canvas"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
