// 12. ПЛАВНАЯ АНИМАЦИЯ ВСЕХ СЛОЕВ И КАМЕРЫ (С ПОДДЕРЖКОЙ afterDraw НА SOFTWARE WEBGL)
// ---------------------------------------------------------------------------
function updateTechnosphereAnimation(sphere, dt, t, intensity = 1.0) {
  sphere.coreMesh.rotation.y += dt * 1.1 * intensity;
  sphere.coreMesh.rotation.x += dt * 0.7 * intensity;
  if (sphere.coreCage) {
    sphere.coreCage.rotation.y -= dt * 0.65 * intensity;
    sphere.coreCage.rotation.z += dt * 0.45 * intensity;
  }
  const pulse = 0.94 + Math.sin(t * 3.8) * 0.08 * intensity;
  sphere.coreMesh.scale.setScalar(pulse);

  sphere.rings.forEach((ring, idx) => {
    ring.rotation.x += dt * (0.55 + idx * 0.25) * intensity * (idx % 2 === 0 ? 1 : -1);
    ring.rotation.y += dt * (0.7 + idx * 0.2) * intensity;
  });

  sphere.updateDataPoints(dt, intensity);
  sphere.codeSphere.rotation.y += dt * 0.25 * intensity;
  sphere.codeTex.offset.y -= dt * 0.18 * intensity;
  sphere.codeTex.offset.x += dt * 0.06 * intensity;

  sphere.wireShell.rotation.y -= dt * 0.12 * intensity;
  if (sphere.dataRingGroup) {
    sphere.dataRingGroup.rotation.y += dt * 0.42 * intensity;
    sphere.dataRingTex.offset.x -= dt * 0.16 * intensity;
  }
  if (sphere.outerMat.userData.shader) {
    sphere.outerMat.userData.shader.uniforms.uTime.value = t * intensity;
  }
}

function dampCam(targetPos, targetLook, lambda, dt) {
  const alpha = 1 - Math.exp(-lambda * dt);
  camera.position.lerp(targetPos, alpha);
  controls.target.lerp(targetLook, alpha);
}

let lastFrameTime = performance.now();
let startTimestamp = lastFrameTime;
let projRefreshAccum = 0;

function updateScene(now) {
  const maxDt = isSoftwareGl ? 0.25 : 0.08;
  const dt = Math.min((now - lastFrameTime) / 1000, maxDt);
  lastFrameTime = now;
  const t = (now - startTimestamp) / 1000;

  // Медленное вращение равномерных галактик и колец куба
  spaceData.galaxies.forEach((g, idx) => {
    g.rotation.y += dt * 0.025 * (idx % 2 === 0 ? 1 : -1);
  });
  cyberCoils.forEach((coil, idx) => {
    coil.rotation.z += dt * (idx % 2 === 0 ? 0.52 : -0.52);
    if (coil.userData.innerRing) {
      coil.userData.innerRing.rotation.z -= dt * (idx % 2 === 0 ? 1.15 : -1.15);
    }
  });
  portalFieldTex.offset.y -= dt * (state.stage === STAGES.SCAN ? 0.62 : 0.16);

  // Договор всегда развернут строго лицом к камере (без переворота)
  _v1.set(camera.position.x, contractPivot.position.y, camera.position.z);
  contractPivot.lookAt(_v1);

  // Живая анимация 4 техносфер ИИ (усиливается во время активного анализа)
  const agentActivity = state.stage === STAGES.SCAN ? 1.8 : (state.stage === STAGES.TRANSFER ? 2.2 : 1.0);
  const flagshipActivity = state.stage === STAGES.ANALYSIS ? 2.8 : (state.stage === STAGES.POWERDOWN ? 0.15 : 1.0);
  updateChamberDust(dt, Math.max(agentActivity, flagshipActivity * 0.7));
  agentSpheres.forEach(a => updateTechnosphereAnimation(a, dt, t, agentActivity));
  updateTechnosphereAnimation(flagshipSphere, dt, t, flagshipActivity);

  // Периодическое обновление живых проекций на внешней поверхности сфер
  projRefreshAccum += dt;
  if (projRefreshAccum >= 0.45 && state.stage !== STAGES.VERDICT && state.stage !== STAGES.POWERDOWN) {
    projRefreshAccum = 0;
    if (state.stage === STAGES.SCAN) {
      const curPage = CONTRACT_PAGES[state.pageIndex];
      agentSpheres.forEach((a, i) => {
        a.updateProjection(
          i === curPage.agentIndex ? 'scan' : 'idle',
          i === curPage.agentIndex ? `EXTRACT: ${curPage.riskCode}` : `BUFFER: ${state.threatsExtracted} RISKS`
        );
      });
      flagshipSphere.updateProjection('idle', `WAITING AGENTS // ${state.threatsExtracted}/${CONTRACT_PAGES.length}`);
    } else if (state.stage === STAGES.ANALYSIS) {
      flagshipSphere.updateProjection('scan', 'COMPUTING GLOBAL RISK MATRIX...');
    } else if (state.stage === STAGES.INTRO) {
      flagshipSphere.updateProjection('idle', 'SECUDEX FLAGSHIP // READY');
    }
  }

  // Плавная логика по стадиям
  if (!state.paused) {
    state.stageTimer += dt;
  }

  if (state.stage === STAGES.INTRO) {
    const playStartupIntro = shouldPlayStartupIntro(hasPlayedStartupIntro, state.stage);
    // 5-фазное кинематографическое появление превью (только один раз при первом открытии сайта/приложения):
    // 1) Съемка сверху сбоку как с квадрокоптера/гирокоптера, закручивание по оси (0..2.55с)
    // 2) На последнем витке ускоренный отлёт назад в пустоту сквозь звёзды (2.55..3.55с)
    // 3) Резкий чёрный экран (3.55..3.85с) + скрытая перестановка камеры
    // 4) Медленное плавное растемнение перед кубом взглядом снизу вверх (~1с: 3.85..5.30с)
    // 5) Резкое отдаление на полный масштаб всей системы (5.30..6.20с)
    const tIntro = state.stageTimer;
    if (playStartupIntro && !userInteracting && tIntro < STAGE_DURATIONS.intro) {
      if (tIntro < 2.55) {
        const u = tIntro / 2.55;
        const spinEase = u * u * (3 - 2 * u) * 0.25 + u * 0.75;
        const angle = 1.25 + spinEase * (Math.PI * 3.2);
        const startRad = isMobile ? 16.8 : 14.4;
        const endRad = isMobile ? 14.0 : 12.0;
        const rad = startRad + (endRad - startRad) * u;
        const camY = 13.4 - u * 4.8;
        camera.position.set(Math.sin(angle) * rad, camY, Math.cos(angle) * rad);
        const bank = Math.sin(u * Math.PI * 2) * 0.085;
        camera.up.set(bank, 1, 0).normalize();
        controls.target.set(0, 3.45 - u * 0.65, -0.2);
        camera.lookAt(controls.target);
        if (camera.fov !== 48) {
          camera.fov = 48;
          camera.updateProjectionMatrix();
        }
        speedStreaksGroup.visible = false;
        irisOverlay.style.opacity = '0';
      } else if (tIntro < 3.55) {
        const w = (tIntro - 2.55) / 1.0;
        const warp = Math.pow(w, 2.1);
        const startA = 1.25 + Math.PI * 3.2;
        const endA = Math.PI * 4.0;
        const angle = startA + (endA - startA) * (1 - Math.pow(1 - w, 2));
        const rad = (isMobile ? 14.0 : 12.0) + warp * 58.0;
        const camY = 8.6 + warp * 5.0;
        camera.position.set(Math.sin(angle) * rad, camY, Math.cos(angle) * rad);
        camera.up.set((1 - w) * 0.04, 1, 0).normalize();
        controls.target.set(0, 2.8 - warp * 0.4, -0.2);
        camera.lookAt(controls.target);
        camera.fov = 48 + warp * 32;
        camera.updateProjectionMatrix();

        // Поток звёздных полос мимо камеры при отлёте назад в пустоту
        speedStreaksGroup.visible = true;
        const posAttr = streakGeo.attributes.position;
        const streakSpeed = 28 + warp * 95;
        for (let i = 0; i < streakCount; i++) {
          let z1 = posAttr.getZ(i * 2) - dt * streakSpeed;
          let z2 = posAttr.getZ(i * 2 + 1) - dt * streakSpeed;
          if (z1 < -30) { z1 += 32; z2 += 32; }
          posAttr.setZ(i * 2, z1);
          posAttr.setZ(i * 2 + 1, z2);
        }
        posAttr.needsUpdate = true;
        irisOverlay.style.opacity = '0';
      } else if (tIntro < 3.85) {
        const blackIn = Math.min((tIntro - 3.55) / 0.11, 1);
        irisOverlay.style.background = '#030108';
        irisOverlay.style.opacity = blackIn.toFixed(3);
        if (tIntro >= 3.68) {
          speedStreaksGroup.visible = false;
          camera.up.set(0, 1, 0);
          if (camera.fov !== 52) {
            camera.fov = 52;
            camera.updateProjectionMatrix();
          }
          camera.position.set(0, -2.35, isMobile ? 7.6 : 6.0);
          controls.target.set(0, 1.55, -0.2);
          camera.lookAt(controls.target);
        }
      } else if (tIntro < 5.30) {
        const holdP = (tIntro - 3.85) / 1.45;
        const fadeOut = Math.min((tIntro - 3.85) / 0.78, 1);
        const darkAlpha = Math.pow(1 - fadeOut, 1.5);
        irisOverlay.style.background = '#030108';
        irisOverlay.style.opacity = darkAlpha.toFixed(3);
        speedStreaksGroup.visible = false;
        camera.up.set(0, 1, 0);
        if (camera.fov !== 52) {
          camera.fov = 52;
          camera.updateProjectionMatrix();
        }
        camera.position.set(0, -2.35 + holdP * 0.12, (isMobile ? 7.6 : 6.0) + holdP * 0.18);
        controls.target.set(0, 1.55 + holdP * 0.12, -0.2);
        camera.lookAt(controls.target);
      } else {
        const zOut = Math.min((tIntro - 5.30) / 0.90, 1);
        const zoomEase = 1 - Math.pow(1 - zOut, 4);
        irisOverlay.style.opacity = '0';
        speedStreaksGroup.visible = false;
        camera.up.set(0, 1, 0);
        const startZ = isMobile ? 7.78 : 6.18;
        const endZ = isMobile ? 20.5 : 16.5;
        camera.position.set(
          0,
          -2.23 + (-0.1 - (-2.23)) * zoomEase,
          startZ + (endZ - startZ) * zoomEase
        );
        controls.target.set(
          0,
          1.67 + (2.65 - 1.67) * zoomEase,
          -0.2 + (-0.3 - (-0.2)) * zoomEase
        );
        camera.lookAt(controls.target);
        camera.fov = 52 - 4 * zoomEase;
        camera.updateProjectionMatrix();
      }
    } else if (!userInteracting && (!introZoomSettled || (hasPlayedStartupIntro && tIntro < 1.8))) {
      if (playStartupIntro) {
        introZoomSettled = true;
        hasPlayedStartupIntro = true;
      }
      irisOverlay.style.opacity = '0';
      speedStreaksGroup.visible = false;
      camera.up.set(0, 1, 0);
      if (hasPlayedStartupIntro && !playStartupIntro) {
        _v2.set(0, -0.1, isMobile ? 20.5 : 16.5);
        _v3.set(0, 2.65, -0.3);
        dampCam(_v2, _v3, 3.6, dt);
      } else {
        camera.position.set(0, -0.1, isMobile ? 20.5 : 16.5);
        controls.target.set(0, 2.65, -0.3);
        camera.lookAt(controls.target);
      }
      if (camera.fov !== 48) {
        camera.fov = 48;
        camera.updateProjectionMatrix();
      }
    }
    portalGlowMat.opacity = 0.28 + Math.sin(t * 2.2) * 0.08;

  } else if (state.stage === STAGES.SCAN) {
    // Последовательное ускоряющееся извлечение страниц из закрытой задней стены куба
    const curPage = CONTRACT_PAGES[state.pageIndex];
    const pageDur = getPageDuration(state.pageIndex);

    if (!state.paused) {
      state.pageTimer += dt;
    }
    const p = Math.min(state.pageTimer / pageDur, 1);
    const activeAgent = agentSpheres[curPage.agentIndex];

    // Фаза A (0..0.30): Лист плавно выходит из закрытой задней стены в центр куба
    if (p < 0.30) {
      const enterP = p / 0.30;
      const ease = 1 - Math.pow(1 - enterP, 3);
      contractPivot.position.set(0, 0.1, (-half + 0.34) + (half - 0.14) * ease);
      portalGlowMat.opacity = 0.88;
      agentScanBeam.visible = false;
      scanBarMat.opacity = 0;
      scanCoreMat.opacity = 0;
      scanLight.intensity = 0;
      packetGroup.visible = false;
    } else if (p < 0.74) {
      // Фаза B (0.30..0.74): Активная ИИ-сфера проецирует объёмный лазерный веер и считывает договор построчно
      const scanP = (p - 0.30) / 0.44;
      contractPivot.position.set(0, 0.1, 0.2 + Math.sin(t * 2.5) * 0.025);
      contractPivot.updateMatrixWorld(true);
      portalGlowMat.opacity = 0.34;

      const scanColorHex = agentSpecs[curPage.agentIndex].accent;
      scanBarMat.color.setHex(scanColorHex);
      scanBarMat.opacity = 0.92;
      scanCoreMat.opacity = 0.95;
      scanBar.position.y = 1.42 - scanP * 2.84;

      // Точные мировые координаты левого, правого края и центра сканирующей строки договора (без аллокаций)
      _scanLeft.set(-1.12, 0, 0.02); scanBar.localToWorld(_scanLeft);
      _scanRight.set(1.12, 0, 0.02); scanBar.localToWorld(_scanRight);
      _scanCenter.set(0, 0, 0.02); scanBar.localToWorld(_scanCenter);

      // Источник луча на передней оптической линзе активной сферы
      _scanOrigin.copy(activeAgent.group.position).lerp(_scanCenter, 0.15);
      scanApertureGlow.position.copy(_scanOrigin);
      scanApertureMat.color.setHex(scanColorHex);
      scanApertureMat.opacity = 0.82 + Math.sin(t * 14) * 0.18;

      // Динамический свет лазера скользит перед страницей, подсвечивая бумагу и раму куба
      _v4.subVectors(camera.position, _scanCenter).normalize();
      scanLight.position.copy(_scanCenter).addScaledVector(_v4, 0.48);
      scanLight.color.setHex(scanColorHex);
      scanLight.intensity = 2.6 + Math.sin(t * 14) * 0.4;

      // Обновляем вершины чистого оптического лазерного веера
      const fv = scanFanGeo.attributes.position;
      fv.setXYZ(0, _scanOrigin.x, _scanOrigin.y, _scanOrigin.z);
      fv.setXYZ(1, _scanLeft.x, _scanLeft.y, _scanLeft.z);
      fv.setXYZ(2, _scanRight.x, _scanRight.y, _scanRight.z);
      fv.needsUpdate = true;
      agentBeamMat.color.setHex(scanColorHex);
      agentBeamMat.opacity = 0.36 + Math.sin(t * 12) * 0.08;
      scanFanTex.offset.y -= dt * 1.45;

      // 5 чётких направляющих лазерных лучей по ширине строки
      const rv = scanRaysGeo.attributes.position;
      for (let r = 0; r < 5; r++) {
        const frac = r / 4;
        const tx = _scanLeft.x + (_scanRight.x - _scanLeft.x) * frac;
        const ty = _scanLeft.y + (_scanRight.y - _scanLeft.y) * frac;
        const tz = _scanLeft.z + (_scanRight.z - _scanLeft.z) * frac;
        rv.setXYZ(r * 2, _scanOrigin.x, _scanOrigin.y, _scanOrigin.z);
        rv.setXYZ(r * 2 + 1, tx, ty, tz);
      }
      rv.needsUpdate = true;
      scanRaysMat.color.setHex(scanColorHex);

      // Вторичные калибровочные лучи от двух других агентов к нижним угловым маякам документа (не пересекают текст)
      const cv = calibRaysGeo.attributes.position;
      _scanLeft.set(-1.12, -1.56, 0.04); pageMesh.localToWorld(_scanLeft);
      _scanRight.set(1.12, -1.56, 0.04); pageMesh.localToWorld(_scanRight);
      let cSlot = 0;
      agentSpheres.forEach((ag, aIdx) => {
        if (aIdx !== curPage.agentIndex && cSlot < 2) {
          const cornerTarget = cSlot === 0 ? _scanLeft : _scanRight;
          _scanTmp.copy(ag.group.position).lerp(cornerTarget, 0.14);
          cv.setXYZ(cSlot * 2, _scanTmp.x, _scanTmp.y, _scanTmp.z);
          cv.setXYZ(cSlot * 2 + 1, cornerTarget.x, cornerTarget.y, cornerTarget.z);
          cSlot++;
        }
      });
      cv.needsUpdate = true;

      agentScanBeam.visible = true;
      packetGroup.visible = false;
    } else {
      // Фаза C (0.74..1.0): Извлечённый риск по дуге вылетает из плашки договора в оптическое ядро агента
      const pullP = (p - 0.74) / 0.26;
      const ease = pullP * pullP * (3 - 2 * pullP);
      agentScanBeam.visible = false;
      scanBarMat.opacity = 0;
      scanCoreMat.opacity = 0;
      packetGroup.visible = true;
      contractPivot.updateMatrixWorld(true);
      _scanTmp.set(0, -0.35, 0.08);
      pageMesh.localToWorld(_scanTmp);
      packetGroup.position.lerpVectors(_scanTmp, activeAgent.group.position, ease);
      packetGroup.position.y += Math.sin(ease * Math.PI) * 0.55;
      packetGroup.position.z += Math.sin(ease * Math.PI) * 0.45;
      packetGroup.rotation.y += dt * 7;
      packetRing.rotation.x += dt * 9;
      packetGroup.scale.setScalar(1.2 - ease * 0.55);

      scanLight.position.copy(packetGroup.position);
      scanLight.color.setHex(0xff3b5c);
      scanLight.intensity = 3.0 * (1 - ease * 0.45);
    }

    if (!userInteracting) {
      _v2.set(0, -0.1, isMobile ? 20.2 : 16.3);
      _v3.set(0, 2.35, -0.2);
      dampCam(_v2, _v3, 2.8, dt);
    }

    if (p >= 1) {
      packetGroup.visible = false;
      scanLight.intensity = 0;
      appendRiskCard(curPage);
      if (state.pageIndex < CONTRACT_PAGES.length - 1) {
        state.pageIndex++;
        state.pageTimer = 0;
        drawContractPage(CONTRACT_PAGES[state.pageIndex]);
        fannedSheets.forEach((sh, sIdx) => {
          sh.visible = sIdx < CONTRACT_PAGES.length - 1 - state.pageIndex + 1;
        });
      } else {
        // Пауза анимаций скана — ждём нажатия кнопки «Передать на анализ флагмана»
        enterStage(STAGES.SCAN_PAUSED);
      }
    }

  } else if (state.stage === STAGES.SCAN_PAUSED) {
    if (!userInteracting) {
      _v2.set(0, -0.1, isMobile ? 20.2 : 16.3);
      _v3.set(0, 2.55, -0.2);
      dampCam(_v2, _v3, 2.5, dt);
    }

  } else if (state.stage === STAGES.TRANSFER) {
    // Плавная 3.4с передача отчётов от 3 агентов вверх в сферу Флагмана
    const p = Math.min(state.stageTimer / STAGE_DURATIONS.transfer, 1);
    transferStreams.forEach((stream, idx) => {
      stream.tube.visible = true;
      stream.tubeMat.opacity = 0.55 * Math.sin(p * Math.PI);
      stream.capsules.forEach((cap, cIdx) => {
        cap.visible = true;
        const cp = (p * 1.65 + cIdx * 0.22 + idx * 0.08) % 1;
        cap.position.copy(stream.curve.getPoint(cp));
      });
    });

    // Камера слегка опускается и смотрит вверх на возвышающийся Флагман
    _v2.set(0, -1.1, isMobile ? 16.2 : 13.0);
    _v3.set(0, 4.8, -0.8);
    dampCam(_v2, _v3, 2.4, dt);

    if (p >= 1) {
      enterStage(STAGES.ANALYSIS, 'finale');
    }

  } else if (state.stage === STAGES.ANALYSIS) {
    // Полный анализ флагманской сферой (пользователь смотрит снизу вверх как на высокое здание)
    const p = Math.min(state.stageTimer / STAGE_DURATIONS.analysis, 1);
    _v2.set(Math.sin(p * 0.9) * 1.4, -1.2, isMobile ? 13.0 : 10.6);
    _v3.set(0, 7.6, -1.3);
    dampCam(_v2, _v3, 2.8, dt);
    flagshipLight.intensity = 6.5 + Math.sin(t * 10) * 1.5;

    if (p >= 1) {
      enterStage(STAGES.VERDICT);
    }

  } else if (state.stage === STAGES.VERDICT) {
    // Резкое вынесение вердикта в процентах на поверхности флагмана и в голограмме над ним
    const p = Math.min(state.stageTimer / STAGE_DURATIONS.verdict, 1);
    _v2.set(0, 1.45, isMobile ? 13.6 : 11.4);
    _v3.set(0, 8.95, -1.3);
    dampCam(_v2, _v3, 4.5, dt);
    flagshipLight.color.setHex(0xff3b5c);
    flagshipLight.intensity = 8.0;
    if (projRefreshAccum >= 0.08) {
      projRefreshAccum = 0;
      flagshipSphere.updateVerdictHologram(true, '84%', state.stageTimer, state.threatsExtracted || CONTRACT_PAGES.length);
    }

    if (p >= 1) {
      enterStage(STAGES.POWERDOWN);
    }

  } else if (state.stage === STAGES.POWERDOWN) {
    // Обесточивание системы перед выбросом импульса
    const p = Math.min(state.stageTimer / STAGE_DURATIONS.powerdown, 1);
    const dim = 1 - p * 0.92;
    hemiLight.intensity = 0.9 * dim;
    keyLight.intensity = 2.3 * dim;
    rimLight.intensity = 1.8 * dim;
    bottomLight.intensity = 3.8 * dim;
    flagshipLight.intensity = 5.5 * dim;
    flagshipSphere.coreMat.emissiveIntensity = 1.9 * dim;
    flagshipSphere.outerMat.emissiveIntensity = 0.9 * dim;
    flagshipSphere.dataRingBandMat.opacity = 0.85 * dim;
    flagshipSphere.dataRingCoreMat.opacity = 0.9 * dim;
    flagshipSphere.armorMats?.forEach((m, idx) => { m.emissiveIntensity = (idx === 2 || idx === 3 ? 1.25 : 0.9) * dim; });
    electrodeGlowMat.emissiveIntensity = 1.65 * dim;
    violetAccentMat.emissiveIntensity = 0.95 * dim;
    cubeReactorArmorMat.emissiveIntensity = 0.95 * dim;
    agentSpheres.forEach(a => {
      a.coreMat.emissiveIntensity = 1.9 * dim;
      a.outerMat.emissiveIntensity = 0.9 * dim;
      a.dataRingBandMat.opacity = 0.72 * dim;
      a.dataRingCoreMat.opacity = 0.9 * dim;
      a.armorMats?.forEach((m, idx) => { m.emissiveIntensity = (idx === 2 || idx === 3 ? 1.25 : 0.9) * dim; });
    });

    if (p >= 1) {
      enterStage(STAGES.BEAM_ASCENT);
    }

  } else if (state.stage === STAGES.BEAM_ASCENT) {
    // Импульс вырывается из северного полюса сферы, камера быстро летит вверх ровно 2.5 секунды и резко останавливается
    const p = Math.min(state.stageTimer / STAGE_DURATIONS.beam_ascent, 1);
    const ease = p < 0.85 ? Math.pow(p / 0.85, 2.2) * 0.92 : 0.92 + ((p - 0.85) / 0.15) * 0.08;
    const camY = 10.5 + ease * 51.5; // от 10.5 до 62.0 ровно за 2.5с
    camera.position.set(0, camY, 4.5 - ease * 10.5);
    controls.target.set(0, camY + 1.2 - ease * 1.2, -38);
    polarCoreMat.opacity = 0.95;
    polarOuterMat.opacity = 0.55 + Math.sin(t * 18) * 0.12;

    if (p >= 1) {
      // Резкая остановка напротив далекого одинокого окна с юристом
      camera.position.set(0, 62, -6.0);
      controls.target.set(0, 62, -38);
      enterStage(STAGES.WINDOW_FOCUS);
    }

  } else if (state.stage === STAGES.WINDOW_FOCUS) {
    // Взгляд вдаль на размытое в перспективе окно, где видно лицо юриста с другой стороны экрана
    const p = Math.min(state.stageTimer / STAGE_DURATIONS.window_focus, 1);
    camera.position.set(0, 62, -6.0 - p * 1.8);
    controls.target.set(0, 62, -38);

    if (p >= 1) {
      enterStage(STAGES.WINDOW_RUSH);
    }

  } else if (state.stage === STAGES.WINDOW_RUSH) {
    // Сильное ускорение камеры вперед к окну вместе с лучом
    const p = Math.min(state.stageTimer / STAGE_DURATIONS.window_rush, 1);
    const rush = Math.pow(p, 2.4);
    camera.position.set(0, 62, -7.8 - rush * 26.5);
    controls.target.set(0, 62, -40);
    camera.fov = 46 + rush * 38;
    camera.updateProjectionMatrix();

    // Анимация полос ускорения
    const posAttr = streakGeo.attributes.position;
    for (let i = 0; i < streakCount; i++) {
      let z1 = posAttr.getZ(i * 2) + dt * (35 + rush * 80);
      let z2 = posAttr.getZ(i * 2 + 1) + dt * (35 + rush * 80);
      if (z1 > 2) { z1 -= 30; z2 -= 30; }
      posAttr.setZ(i * 2, z1);
      posAttr.setZ(i * 2 + 1, z2);
    }
    posAttr.needsUpdate = true;

    if (p >= 1) {
      enterStage(STAGES.COLLAPSE);
    }

  } else if (state.stage === STAGES.COLLAPSE) {
    // Сворачивание в темноту перед резким появлением логотипа SECUDEX
    const p = Math.min(state.stageTimer / STAGE_DURATIONS.collapse, 1);
    const radiusPct = Math.max(0, 100 - p * 108);
    irisOverlay.style.opacity = '1';
    irisOverlay.style.background = `radial-gradient(circle at center, rgba(3,1,8,${p.toFixed(2)}) 0%, #030108 ${radiusPct.toFixed(1)}%)`;

    if (p >= 1) {
      enterStage(STAGES.LOGO_REVEAL);
    }
  }

  const scriptedIntroActive = shouldPlayStartupIntro(hasPlayedStartupIntro, state.stage)
    && !userInteracting && state.stageTimer < STAGE_DURATIONS.intro;
  if (!scriptedIntroActive) {
    controls.update();
  }
}

let frameId = 0;
function afterDraw(cb) {
  try {
    const gl = renderer.getContext();
    const sync = gl.fenceSync && gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    if (!sync) {
      frameId = window.setTimeout(cb, 16);
      return;
    }
    gl.flush();
    const poll = () => {
      const st = gl.getSyncParameter(sync, gl.SYNC_STATUS);
      if (st === gl.UNSIGNALED) {
        frameId = window.setTimeout(poll, 5);
      } else {
        gl.deleteSync(sync);
        frameId = window.setTimeout(cb, 16);
      }
    };
    frameId = window.setTimeout(poll, 5);
  } catch {
    frameId = window.setTimeout(cb, 16);
  }
}

function updatePostProcessing(nowMs) {
  if (!composer) return;
  const warpActive = speedStreaksGroup.visible;
  const camDist = camera.position.distanceTo(controls.target);
  computeCinemaOptics(state.stage, camDist, warpActive, _opticsState);

  smoothedDofFocus += (_opticsState.focus - smoothedDofFocus) * 0.16;
  if (bokehPass) {
    bokehPass.enabled = _opticsState.aperture > 0;
    bokehPass.uniforms.focus.value = smoothedDofFocus;
    bokehPass.uniforms.aperture.value = _opticsState.aperture;
  }
  if (bloomPass) {
    bloomPass.strength = _opticsState.bloomStrength;
  }
  if (cinemaOpticsPass) {
    cinemaOpticsPass.uniforms.uTime.value = (nowMs - startTimestamp) * 0.001;
    cinemaOpticsPass.uniforms.uChroma.value = _opticsState.chromaAmount;
  }
}

function tick(now) {
  const nowMs = typeof now === 'number' ? now : performance.now();
  updateScene(nowMs);
  if (composer && !isSoftwareGl) {
    updatePostProcessing(nowMs);
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
  if (isSoftwareGl) {
    afterDraw(() => tick(performance.now()));
  } else {
    frameId = requestAnimationFrame(tick);
  }
}

window.addEventListener('resize', () => {
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) {
    const postDpr = Math.min(window.devicePixelRatio || 1, 1.5);
    composer.setPixelRatio(postDpr);
    composer.setSize(w, h);
    if (bloomPass) {
      bloomPass.resolution.set(Math.max(1, Math.floor(w * 0.5)), Math.max(1, Math.floor(h * 0.5)));
    }
    if (bokehPass) {
      bokehPass.uniforms.aspect.value = w / h;
    }
  }
});

if (!isSoftwareGl) {
  renderer.compile(scene, camera);
}
lastFrameTime = performance.now();
startTimestamp = lastFrameTime;
tick(lastFrameTime);
</script>
