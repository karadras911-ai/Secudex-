<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import {
  STAGES,
  STAGE_DURATIONS,
  CONTRACT_PAGES,
  CAMERA_LIMITS,
  AUDIO_TRACKS,
  getPageDuration,
  getNextUserAction,
  getSlideGroup,
  shouldPlayStartupIntro,
  computeDataStreamPoint,
  computeCinemaOptics,
} from './timeline.js';

const LOGO_ASSET_URL = '/assets/aistudio/SJmoFqjxktcBE2_s7xOueDeqy587oy99Ot1z7gbeKKnIrY2zsbBkL1zgb2IoWHCpMmqPzL6XRzkbhq-Kv8329mNh-1_1645ecf9.jpg';

// Определение software WebGL (SwiftShader / llvmpipe) для стабильной работы в любом окружении
const isSoftwareGl = (() => {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    if (!gl) return true;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const param = ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER;
    const gpu = String(gl.getParameter(param) || '');
    gl.getExtension('WEBGL_lose_context')?.loseContext();
    return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
  } catch {
    return true;
  }
})();

// Предвыделенные временные векторы и матрицы (без аллокаций в цикле рендера)
const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _v3 = new THREE.Vector3();
const _v4 = new THREE.Vector3();
const _scanLeft = new THREE.Vector3();
const _scanRight = new THREE.Vector3();
const _scanCenter = new THREE.Vector3();
const _scanOrigin = new THREE.Vector3();
const _scanTmp = new THREE.Vector3();
const _q1 = new THREE.Quaternion();
const _up = new THREE.Vector3(0, 1, 0);
const _opticsState = { focus: 16.5, aperture: 0.00011, bloomStrength: 0.36, chromaAmount: 0.00045 };

// ---------------------------------------------------------------------------
// 1. СЦЕНА, РЕНДЕРЕР, HIGH-CONTRAST STUDIO PMREM И КАМЕРА С ОГРАНИЧЕНИЯМИ
// ---------------------------------------------------------------------------
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030109);
scene.fog = new THREE.FogExp2(0x030109, 0.011);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 220);
const isMobile = window.innerWidth < 640;
camera.position.set(0, -0.1, isMobile ? 20.5 : 16.5);

const renderer = new THREE.WebGLRenderer({
  antialias: !isSoftwareGl,
  powerPreference: 'high-performance',
});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Оптимизированный конвейер пост-обработки (включается только на аппаратном GPU)
const CinemaOpticsShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uChroma: { value: 0.00045 },
    uVignette: { value: 0.24 },
    uGrain: { value: 0.018 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uChroma;
    uniform float uVignette;
    uniform float uGrain;
    varying vec2 vUv;
    void main() {
      vec2 dir = vUv - 0.5;
      float distSq = dot(dir, dir);
      vec2 shift = dir * (uChroma * distSq * 3.2);
      float r = texture2D(tDiffuse, vUv - shift).r;
      vec4 base = texture2D(tDiffuse, vUv);
      float b = texture2D(tDiffuse, vUv + shift).b;
      vec3 col = vec3(r, base.g, b);

      float vig = 1.0 - smoothstep(0.18, 0.78, distSq) * uVignette;
      col *= vig;

      float noise = fract(sin(dot(vUv * 1024.0 + fract(uTime) * 37.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (noise - 0.5) * uGrain;
      gl_FragColor = vec4(max(col, 0.0), base.a);
    }
  `,
};

let composer = null;
let bloomPass = null;
let bokehPass = null;
let cinemaOpticsPass = null;
let smoothedDofFocus = 16.5;

function initOptimizedPostProcessing() {
  if (isSoftwareGl) return;
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  const postDpr = Math.min(window.devicePixelRatio || 1, 1.5);

  const rt = new THREE.WebGLRenderTarget(
    Math.floor(w * postDpr),
    Math.floor(h * postDpr),
    {
      type: THREE.HalfFloatType,
      samples: renderer.capabilities.isWebGL2 ? 4 : 0,
    }
  );
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(postDpr);
  composer.setSize(w, h);

  composer.addPass(new RenderPass(scene, camera));

  // Bloom в половину разрешения экрана снижает нагрузку на видеопамять на 75%
  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(Math.max(1, Math.floor(w * 0.5)), Math.max(1, Math.floor(h * 0.5))),
    0.36,
    0.36,
    0.86
  );
  composer.addPass(bloomPass);

  // Динамический автофокус BokehPass: держит активный объект резким, смягчая только дальний космос
  bokehPass = new BokehPass(scene, camera, {
    focus: 16.5,
    aperture: 0.00011,
    maxblur: 0.004,
  });
  composer.addPass(bokehPass);

  // Объединённый проход хроматической аберрации, виньетки и плёночного зерна (1 проход вместо 3)
  cinemaOpticsPass = new ShaderPass(CinemaOpticsShader);
  composer.addPass(cinemaOpticsPass);

  composer.addPass(new OutputPass());
}
initOptimizedPostProcessing();

function buildStudioSoftboxEnv() {
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x04060e);

  const disposables = [];
  const addPanel = (w, h, colorHex, intensity, pos, rot) => {
    const geo = new THREE.PlaneGeometry(w, h);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(colorHex).multiplyScalar(intensity),
      side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(...pos);
    mesh.rotation.set(...rot);
    envScene.add(mesh);
    disposables.push(geo, mat);
  };

  // Темная космическая студия-ангар с контрастными узкими софтбоксами для четких бликов на фасках
  const boxGeo = new THREE.BoxGeometry(36, 26, 36);
  const boxMat = new THREE.MeshBasicMaterial({ color: 0x070a15, side: THREE.BackSide });
  envScene.add(new THREE.Mesh(boxGeo, boxMat));
  disposables.push(boxGeo, boxMat);

  // Верхний вытянутый ключевой софтбокс (холодный титановый белый)
  addPanel(18, 2.8, 0xe2e8f0, 4.2, [0, 12.2, 2.5], [Math.PI / 2, 0, 0]);
  // Левый циановый контровой стрип
  addPanel(2.4, 16, 0x38bdf8, 4.8, [-14.5, 2.0, -3.5], [0, Math.PI / 2, 0]);
  // Правый фиолетово-аметистовый заполняющий стрип
  addPanel(2.6, 15, 0xa855f7, 3.6, [14.5, 1.5, 1.0], [0, -Math.PI / 2, 0]);
  // Передний верхний узкий световой акцент для оптики визора
  addPanel(12, 1.3, 0xf8fafc, 2.8, [0, 7.5, 14.5], [0, Math.PI, 0]);
  // Нижний глубокий индиго-отражатель
  addPanel(20, 20, 0x1e1b4b, 0.9, [0, -11.5, 0], [-Math.PI / 2, 0, 0]);

  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromScene(envScene, 0.032);
  pmrem.dispose();
  disposables.forEach(d => d.dispose());
  return rt.texture;
}
scene.environment = buildStudioSoftboxEnv();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = !isSoftwareGl;
controls.dampingFactor = 0.06;
controls.minDistance = CAMERA_LIMITS.minDistance;
controls.maxDistance = CAMERA_LIMITS.maxDistance;
controls.minAzimuthAngle = CAMERA_LIMITS.minAzimuthAngle;
controls.maxAzimuthAngle = CAMERA_LIMITS.maxAzimuthAngle;
controls.minPolarAngle = CAMERA_LIMITS.minPolarAngle;
controls.maxPolarAngle = CAMERA_LIMITS.maxPolarAngle;
controls.target.set(0, 2.65, -0.3);
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

let userInteracting = false;
let introZoomSettled = false;
let hasPlayedStartupIntro = false;
controls.addEventListener('start', () => {
  userInteracting = true;
  if (state.stage === STAGES.INTRO) {

function heightCanvasToNormalTex(canvas, strength = 2.6, repeatX = 1, repeatY = 1) {
  const w = canvas.width;
  const h = canvas.height;
  const ctx = canvas.getContext('2d');
  const src = ctx.getImageData(0, 0, w, h).data;
  const out = new Uint8Array(w * h * 4);
  const sampleH = (x, y) => {
    const wx = ((x % w) + w) % w;
    const wy = ((y % h) + h) % h;
    return src[(wy * w + wx) * 4] / 255;
  };
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const tl = sampleH(x - 1, y - 1);
      const t  = sampleH(x,     y - 1);
      const tr = sampleH(x + 1, y - 1);
      const l  = sampleH(x - 1, y);
      const r  = sampleH(x + 1, y);
      const bl = sampleH(x - 1, y + 1);
      const b  = sampleH(x,     y + 1);
      const br = sampleH(x + 1, y + 1);

      const dx = (tr + 2 * r + br) - (tl + 2 * l + bl);
      const dy = (bl + 2 * b + br) - (tl + 2 * t + tr);
      let nx = -dx * strength;
      let ny = -dy * strength;
      let nz = 1.0;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;

      const idx = (y * w + x) * 4;
      out[idx] = Math.round((nx * 0.5 + 0.5) * 255);
      out[idx + 1] = Math.round((ny * 0.5 + 0.5) * 255);
      out[idx + 2] = Math.round((nz * 0.5 + 0.5) * 255);
      out[idx + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(out, w, h, THREE.RGBAFormat);
  tex.colorSpace = THREE.NoColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

function createBrushedMetalMaps() {

function createBalancedSpace() {
  const spaceGroup = new THREE.Group();

  const starCount = 2200;
  const sPos = new Float32Array(starCount * 3);
  const sCol = new Float32Array(starCount * 3);
  const palette = [
    new THREE.Color(0xffffff),
    new THREE.Color(0xc4b5fd),
    new THREE.Color(0x93c5fd),
    new THREE.Color(0xe879f9),
  ];
  for (let i = 0; i < starCount; i++) {
    const r = 28 + Math.random() * 78;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    sPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    sPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) + 8;
    sPos[i * 3 + 2] = r * Math.cos(phi) - 10;
    const col = palette[i % palette.length];
    sCol[i * 3] = col.r; sCol[i * 3 + 1] = col.g; sCol[i * 3 + 2] = col.b;
  }
  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
  spaceGroup.add(new THREE.Points(sGeo, new THREE.PointsMaterial({
    size: 0.16, vertexColors: true, transparent: true, opacity: 0.85,
  })));

  const createGalaxy = (pos, rot, scale) => {
    const count = 1600;
    const gPos = new Float32Array(count * 3);
    const gCol = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const arm = i % 3;
      const dist = Math.pow(Math.random(), 1.35) * 9;
      const angle = dist * 0.65 + (arm * Math.PI * 2) / 3 + (Math.random() - 0.5) * 0.4;
      gPos[i * 3] = Math.cos(angle) * dist;
      gPos[i * 3 + 1] = (Math.random() - 0.5) * (0.55 / (1 + dist * 0.3));
      gPos[i * 3 + 2] = Math.sin(angle) * dist;

      const c = dist < 2.1
        ? new THREE.Color(0xffffff)
        : (Math.random() > 0.45 ? new THREE.Color(0xa855f7) : new THREE.Color(0x60a5fa));
      gCol[i * 3] = c.r; gCol[i * 3 + 1] = c.g; gCol[i * 3 + 2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(gCol, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 0.15, vertexColors: true, transparent: true, opacity: 0.72,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    pts.position.set(...pos);
    pts.rotation.set(...rot);
    pts.scale.setScalar(scale);
    spaceGroup.add(pts);
    return pts;
  };

  // Симметричное / равномерное обрамление новой монументальной сцены
  const gLeftTop = createGalaxy([-21, 13, -38], [0.65, 0.25, 0.35], 1.25);
  const gRightTop = createGalaxy([21, 13, -38], [0.65, -0.25, -0.35], 1.25);
  const gLeftLow = createGalaxy([-18, -5, -42], [-0.45, 0.3, -0.2], 1.15);
  const gRightLow = createGalaxy([18, -5, -42], [-0.45, -0.3, 0.2], 1.15);

  scene.add(spaceGroup);
  return { spaceGroup, galaxies: [gLeftTop, gRightTop, gLeftLow, gRightLow] };
}

function createLogoTextureAndFallback(onReady) {
  const placeholderCanvas = document.createElement('canvas');
  placeholderCanvas.width = 16;
  placeholderCanvas.height = 8;
  const tex = new THREE.CanvasTexture(placeholderCanvas);
  tex.colorSpace = THREE.SRGBColorSpace;

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || 1024;
    canvas.height = img.naturalHeight || 512;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    // Удаляем сплошной черный фон с мягким сглаживанием краев
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const maxC = Math.max(r, g, b);
      if (maxC < 20) {
        data[i + 3] = 0;
      } else if (maxC < 56) {
        data[i + 3] = Math.round(((maxC - 20) / 36) * 255);
      }
    }
    ctx.putImageData(imgData, 0, 0);

    const loadedTex = new THREE.CanvasTexture(canvas);
    loadedTex.colorSpace = THREE.SRGBColorSpace;
    loadedTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    loadedTex.needsUpdate = true;

    // Отрисовываем тот же прозрачный логотип на финальный оверлей
    const finalCanvas = document.getElementById('final-logo-canvas');
    if (finalCanvas) {
      finalCanvas.width = canvas.width;
      finalCanvas.height = canvas.height;
      const fCtx = finalCanvas.getContext('2d');
      fCtx.clearRect(0, 0, finalCanvas.width, finalCanvas.height);
      fCtx.drawImage(canvas, 0, 0);
    }
    if (onReady) onReady(canvas.width / canvas.height, loadedTex);
  };
  img.src = LOGO_ASSET_URL;
  return tex;
}

function createCubeReactorMaps() {
  const size = 512;
  const colC = document.createElement('canvas'); colC.width = colC.height = size;
  const colCtx = colC.getContext('2d');
  const bumpC = document.createElement('canvas'); bumpC.width = bumpC.height = size;
  const bumpCtx = bumpC.getContext('2d');
  const roughC = document.createElement('canvas'); roughC.width = roughC.height = size;
  const roughCtx = roughC.getContext('2d');
  const emC = document.createElement('canvas'); emC.width = emC.height = size;
  const emCtx = emC.getContext('2d');

  colCtx.fillStyle = '#0c0618';
  colCtx.fillRect(0, 0, size, size);
  bumpCtx.fillStyle = '#6c6c6c';
  bumpCtx.fillRect(0, 0, size, size);
  roughCtx.fillStyle = '#707070';
  roughCtx.fillRect(0, 0, size, size);
  emCtx.fillStyle = '#000000';
  emCtx.fillRect(0, 0, size, size);

  // Тонкая шлифовка титаново-обсидиановой брони
  for (let i = 0; i < 1500; i++) {
    const v = 16 + Math.floor(Math.random() * 20);
    colCtx.fillStyle = `rgba(${v + 12}, ${v + 4}, ${v + 30}, 0.35)`;
    colCtx.fillRect(Math.random() * size, Math.random() * size, 16 + Math.random() * 48, 1);
  }

  // Кибернетическая сетка силовых секций (4x4) с фасками, заклепками и шинами данных
  const step = size / 4;
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const px = c * step, py = r * step, pad = 6;
      colCtx.strokeStyle = 'rgba(3, 1, 8, 0.92)';
      colCtx.lineWidth = 6;
      colCtx.strokeRect(px, py, step, step);

      colCtx.fillStyle = ((r + c) % 2 === 0) ? '#170d2e' : '#120924';
      colCtx.fillRect(px + pad, py + pad, step - pad * 2, step - pad * 2);
      colCtx.strokeStyle = 'rgba(167, 139, 250, 0.22)';
      colCtx.lineWidth = 1.5;
      colCtx.strokeRect(px + pad + 1, py + pad + 1, step - pad * 2 - 2, step - pad * 2 - 2);

      bumpCtx.strokeStyle = '#121212';
      bumpCtx.lineWidth = 6;
      bumpCtx.strokeRect(px, py, step, step);
      bumpCtx.fillStyle = ((r + c) % 2 === 0) ? '#c2c2c2' : '#9e9e9e';
      bumpCtx.fillRect(px + pad + 2, py + pad + 2, step - pad * 2 - 4, step - pad * 2 - 4);

      roughCtx.fillStyle = ((r + c) % 2 === 0) ? '#444444' : '#828282';
      roughCtx.fillRect(px + pad + 2, py + pad + 2, step - pad * 2 - 4, step - pad * 2 - 4);

      // Болтовые фиксаторы и маркировка квантовых шин
      [[px + 13, py + 13], [px + step - 13, py + 13], [px + 13, py + step - 13], [px + step - 13, py + step - 13]].forEach(([bx, by]) => {
        colCtx.fillStyle = '#070310';
        colCtx.beginPath(); colCtx.arc(bx, by, 3, 0, Math.PI * 2); colCtx.fill();
        colCtx.fillStyle = '#64748b';
        colCtx.beginPath(); colCtx.arc(bx, by, 1.8, 0, Math.PI * 2); colCtx.fill();
        bumpCtx.fillStyle = '#d8d8d8';
        bumpCtx.beginPath(); bumpCtx.arc(bx, by, 2.2, 0, Math.PI * 2); bumpCtx.fill();
      });

      if ((r + c) % 2 === 0) {
        for (let lv = 0; lv < 4; lv++) {
          const ly = py + 24 + lv * 8;
          colCtx.fillStyle = '#05020d';
          colCtx.fillRect(px + 20, ly, step - 42, 3.5);
          bumpCtx.fillStyle = '#1c1c1c';
          bumpCtx.fillRect(px + 20, ly, step - 42, 3.5);
        }
        emCtx.strokeStyle = '#38bdf8';
        emCtx.lineWidth = 1.6;
        emCtx.beginPath();
        emCtx.moveTo(px + 20, py + step - 24);
        emCtx.lineTo(px + step * 0.56, py + step - 24);
        emCtx.lineTo(px + step * 0.72, py + step - 15);
        emCtx.lineTo(px + step - 18, py + step - 15);
        emCtx.stroke();
      } else {
        colCtx.fillStyle = 'rgba(139, 92, 246, 0.45)';
        colCtx.font = 'bold 9px monospace';
        colCtx.fillText(`Q-NODE ${r}${c}`, px + 20, py + 30);
        emCtx.fillStyle = '#a855f7';
        emCtx.fillRect(px + 20, py + step - 20, 22, 2.5);
        emCtx.fillStyle = '#38bdf8';
        emCtx.fillRect(px + 48, py + step - 20, 8, 2.5);
      }
    }
  }

  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const colorTex = new THREE.CanvasTexture(colC);
  colorTex.colorSpace = THREE.SRGBColorSpace;
  colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
  colorTex.anisotropy = maxAniso;

  const normalTex = heightCanvasToNormalTex(bumpC, 3.2, 1, 1);

  const roughTex = new THREE.CanvasTexture(roughC);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
  roughTex.anisotropy = maxAniso;

  const emissiveTex = new THREE.CanvasTexture(emC);
  emissiveTex.colorSpace = THREE.SRGBColorSpace;
  emissiveTex.wrapS = emissiveTex.wrapT = THREE.RepeatWrapping;
  emissiveTex.anisotropy = maxAniso;

  return { colorTex, normalTex, roughTex, emissiveTex };
}

function buildFaceElectrodeAssembly(hasCenterEmitter) {
  const fGroup = new THREE.Group();
  const cOff = 1.56;
  [[-cOff, cOff], [cOff, cOff], [-cOff, -cOff], [cOff, -cOff]].forEach(([ex, ey]) => {
    const mod = new THREE.Group();
    mod.position.set(ex, ey, 0);
    const plate = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.44, 0.06), cubeReactorArmorMat);
    const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.19, 0.08, 6), cyberChromeMat);
    flange.rotation.x = Math.PI / 2;
    const insulator = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.12, 0.1, 12), cyberArmorMat);
    insulator.rotation.x = Math.PI / 2;
    insulator.position.z = -0.05;
    const outerCap = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, 0.06, 6), electrodeGlowMat);
    outerCap.rotation.x = Math.PI / 2;
    outerCap.position.z = 0.06;
    [-0.045, 0.045].forEach(px => {
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.024, 0.22, 8), cyberChromeMat);
      rod.rotation.x = Math.PI / 2;
      rod.position.set(px, 0, -0.15);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), electrodeGlowMat);
      tip.position.set(px, 0, -0.27);
      mod.add(rod, tip);
    });
    mod.add(plate, flange, insulator, outerCap);
    fGroup.add(mod);
  });

  const tracePts = [
    new THREE.Vector3(-1.82, 1.82, 0), new THREE.Vector3(-1.56, 1.56, 0),
    new THREE.Vector3(1.82, 1.82, 0), new THREE.Vector3(1.56, 1.56, 0),
    new THREE.Vector3(-1.82, -1.82, 0), new THREE.Vector3(-1.56, -1.56, 0),
    new THREE.Vector3(1.82, -1.82, 0), new THREE.Vector3(1.56, -1.56, 0),
    new THREE.Vector3(-1.56, 1.56, 0), new THREE.Vector3(1.56, 1.56, 0),
    new THREE.Vector3(-1.56, -1.56, 0), new THREE.Vector3(1.56, -1.56, 0),
    new THREE.Vector3(-1.56, 1.56, 0), new THREE.Vector3(-1.56, -1.56, 0),
    new THREE.Vector3(1.56, 1.56, 0), new THREE.Vector3(1.56, -1.56, 0),
  ];
  fGroup.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(tracePts),
    new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.38 })
  ));

  [-0.74, 0.74].forEach(bx => {
    [-1.78, 1.78].forEach(by => {
      const capBlock = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.12, 0.1), cyberArmorMat);
      capBlock.position.set(bx, by, 0);
      const busGlow = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.03, 0.115), electrodeGlowMat);
      busGlow.position.set(bx, by, 0);
      const pin = new THREE.Mesh(new THREE.ConeGeometry(0.026, 0.16, 8), electrodeGlowMat);
      pin.rotation.x = -Math.PI / 2;
      pin.position.set(bx, by, -0.1);
      fGroup.add(capBlock, busGlow, pin);
    });
  });

  if (hasCenterEmitter) {
    // Боковые и верхний/нижний силовые контуры охлаждения (не перекрывают центр)
    [-1.42, 1.42].forEach(mx => {
      const pod = new THREE.Mesh(new THREE.BoxGeometry(0.24, 1.45, 0.14), cubeReactorArmorMat);
      pod.position.set(mx, 0, 0);
      const podTrim = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.25, 0.165), violetAccentMat);
      podTrim.position.set(mx, 0, 0);
      const podPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.68, 8), cyberChromeMat);
      podPipe.position.set(mx > 0 ? mx - 0.15 : mx + 0.15, 0, 0.02);
      fGroup.add(pod, podTrim, podPipe);
    });

    const emitter = new THREE.Group();
    const outerRing = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.052, 10, 32), cyberChromeMat);
    const midArmorRing = new THREE.Mesh(new THREE.TorusGeometry(0.49, 0.04, 8, 24), cyberArmorMat);
    const coilRing = new THREE.Mesh(new THREE.TorusGeometry(0.37, 0.024, 8, 24), electrodeGlowMat);
    const hexBase = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.27, 0.12, 6), cubeReactorArmorMat);
    hexBase.rotation.x = Math.PI / 2;
    const centerNeedle = new THREE.Mesh(new THREE.ConeGeometry(0.058, 0.34, 8), electrodeGlowMat);
    centerNeedle.rotation.x = -Math.PI / 2;
    centerNeedle.position.z = -0.21;
    for (let k = 0; k < 6; k++) {
      const a = (k * Math.PI) / 3;
      const clamp = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.25, 0.12), cyberArmorMat);
      clamp.position.set(Math.cos(a) * 0.62, Math.sin(a) * 0.62, 0);
      clamp.rotation.z = a + Math.PI / 2;
      emitter.add(clamp);
    }
    emitter.add(outerRing, midArmorRing, coilRing, hexBase, centerNeedle);
    emitter.userData.innerRing = coilRing;
    fGroup.add(emitter);
    cyberCoils.push(emitter);
  }
  return fGroup;
}

// Реалистичные PBR-текстуры, закрытые техно-цифровые пластины, силовой каркас и внутреннее ядро
// ---------------------------------------------------------------------------
function createTechArmorMaps(accentHex) {
  const size = 512;
  const colC = document.createElement('canvas');
  colC.width = colC.height = size;
  const colCtx = colC.getContext('2d');

  const bumpC = document.createElement('canvas');
  bumpC.width = bumpC.height = size;
  const bumpCtx = bumpC.getContext('2d');

  const roughC = document.createElement('canvas');
  roughC.width = roughC.height = size;
  const roughCtx = roughC.getContext('2d');

  const emC = document.createElement('canvas');
  emC.width = emC.height = size;
  const emCtx = emC.getContext('2d');

  // Базовая темная углеродно-титановая броня
  colCtx.fillStyle = '#0e1524';
  colCtx.fillRect(0, 0, size, size);
  bumpCtx.fillStyle = '#787878';
  bumpCtx.fillRect(0, 0, size, size);
  roughCtx.fillStyle = '#7a7a7a';
  roughCtx.fillRect(0, 0, size, size);
  emCtx.fillStyle = '#000000';
  emCtx.fillRect(0, 0, size, size);

  // Металлическая шлифовка и микро-зерно поверхности
  for (let i = 0; i < 1800; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const w = 14 + Math.random() * 54;
    const v = 16 + Math.floor(Math.random() * 20);
    colCtx.fillStyle = `rgba(${v + 4}, ${v + 12}, ${v + 28}, 0.35)`;
    colCtx.fillRect(x, y, w, 1);
    const rv = 70 + Math.floor(Math.random() * 65);
    roughCtx.fillStyle = `rgb(${rv},${rv},${rv})`;
    roughCtx.fillRect(x, y, w, 1);
  }

  // Сегментированные закрытые бронепластины со скосами, заклепками и цифровыми шинами
  const cols = 4;
  const rows = 4;
  const cellW = size / cols;
  const cellH = size / rows;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const px = c * cellW;
      const py = r * cellH;
      const pad = 5;
      const shade = ((r + c) % 3 === 0) ? '#172236' : (((r * 3 + c) % 2 === 0) ? '#111a2b' : '#1b273d');

      // Внутренняя приподнятая пластина (Albedo + Crevice AO + Height + Roughness)
      colCtx.strokeStyle = 'rgba(2, 4, 10, 0.88)';
      colCtx.lineWidth = 6;
      colCtx.strokeRect(px, py, cellW, cellH);

      colCtx.fillStyle = shade;
      colCtx.fillRect(px + pad, py + pad, cellW - pad * 2, cellH - pad * 2);

      // Фаска / блик по верхней-левой кромке, микро-тень по нижней-правой
      colCtx.strokeStyle = 'rgba(148, 163, 184, 0.28)';
      colCtx.lineWidth = 1.5;
      colCtx.strokeRect(px + pad + 1, py + pad + 1, cellW - pad * 2 - 2, cellH - pad * 2 - 2);

      // Глубокий стык между пластинами на карте высот (для точного tangent-space normalMap)
      bumpCtx.strokeStyle = '#141414';
      bumpCtx.lineWidth = 6;
      bumpCtx.strokeRect(px, py, cellW, cellH);
      bumpCtx.fillStyle = ((r + c) % 2 === 0) ? '#c0c0c0' : '#a2a2a2';
      bumpCtx.fillRect(px + pad + 2, py + pad + 2, cellW - pad * 2 - 4, cellH - pad * 2 - 4);

      roughCtx.fillStyle = ((r + c) % 2 === 0) ? '#444444' : '#8a8a8a';
      roughCtx.fillRect(px + pad + 2, py + pad + 2, cellW - pad * 2 - 4, cellH - pad * 2 - 4);

      // Угловые крепежные болты / микро-фиксаторы
      const bOff = 11;
      [
        [px + bOff, py + bOff], [px + cellW - bOff, py + bOff],
        [px + bOff, py + cellH - bOff], [px + cellW - bOff, py + cellH - bOff],
      ].forEach(([bx, by]) => {
        colCtx.fillStyle = '#090d16';
        colCtx.beginPath(); colCtx.arc(bx, by, 3.1, 0, Math.PI * 2); colCtx.fill();
        colCtx.fillStyle = '#475569';
        colCtx.beginPath(); colCtx.arc(bx, by, 2.0, 0, Math.PI * 2); colCtx.fill();
        bumpCtx.fillStyle = '#222222';
        bumpCtx.beginPath(); bumpCtx.arc(bx, by, 3.0, 0, Math.PI * 2); bumpCtx.fill();
        bumpCtx.fillStyle = '#d4d4d4';
        bumpCtx.beginPath(); bumpCtx.arc(bx, by, 1.5, 0, Math.PI * 2); bumpCtx.fill();
      });

      // Тонкие цифровые дорожки и микро-решетки охлаждения на части пластин
      if ((r + c) % 2 === 0) {
        for (let lv = 0; lv < 4; lv++) {
          const ly = py + 22 + lv * 7;
          colCtx.fillStyle = '#050811';
          colCtx.fillRect(px + 18, ly, cellW - 44, 3);
          bumpCtx.fillStyle = '#1e1e1e';
          bumpCtx.fillRect(px + 18, ly, cellW - 44, 3);
        }
        // Тонкая цифровая шина данных
        emCtx.strokeStyle = accentHex;
        emCtx.lineWidth = 1.4;
        emCtx.beginPath();
        emCtx.moveTo(px + 18, py + cellH - 28);
        emCtx.lineTo(px + cellW * 0.55, py + cellH - 28);
        emCtx.lineTo(px + cellW * 0.68, py + cellH - 18);
        emCtx.lineTo(px + cellW - 18, py + cellH - 18);
        emCtx.stroke();

        emCtx.fillStyle = accentHex;
        emCtx.fillRect(px + cellW - 26, py + 14, 10, 3);
      } else {
        // Цифровая матрица микро-датчиков
        colCtx.fillStyle = 'rgba(100, 116, 139, 0.35)';
        colCtx.font = 'bold 9px monospace';
        colCtx.fillText(`SDX-${r}${c}9`, px + 18, py + 28);
        emCtx.fillStyle = accentHex;
        emCtx.fillRect(px + 18, py + cellH - 20, 18, 2.5);
        emCtx.fillRect(px + 40, py + cellH - 20, 6, 2.5);
      }
    }
  }

  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const colorTex = new THREE.CanvasTexture(colC);
  colorTex.colorSpace = THREE.SRGBColorSpace;
  colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
  colorTex.anisotropy = maxAniso;

  const normalTex = heightCanvasToNormalTex(bumpC, 3.1, 1, 1);

  const roughTex = new THREE.CanvasTexture(roughC);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
  roughTex.anisotropy = maxAniso;

  const emissiveTex = new THREE.CanvasTexture(emC);
  emissiveTex.colorSpace = THREE.SRGBColorSpace;
  emissiveTex.wrapS = emissiveTex.wrapT = THREE.RepeatWrapping;
  emissiveTex.anisotropy = maxAniso;

  return { colorTex, normalTex, roughTex, emissiveTex };
}

function createPointSpriteTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(16, 16, 1, 16, 16, 15);
  g.addColorStop(0, 'rgba(255, 255, 255, 1)');
  g.addColorStop(0.35, 'rgba(186, 230, 253, 0.85)');
  g.addColorStop(1, 'rgba(56, 189, 248, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 32, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const dataPointSpriteTex = createPointSpriteTex();

// Лёгкие атмосферные квантовые микрочастицы внутри и вокруг камеры куба
const chamberDustCount = 140;
const chamberDustPos = new Float32Array(chamberDustCount * 3);
const chamberDustPhase = new Float32Array(chamberDustCount);
for (let i = 0; i < chamberDustCount; i++) {
  chamberDustPos[i * 3] = (Math.random() - 0.5) * 5.2;
  chamberDustPos[i * 3 + 1] = -1.9 + Math.random() * 4.8;
  chamberDustPos[i * 3 + 2] = (Math.random() - 0.5) * 5.2;
  chamberDustPhase[i] = Math.random() * Math.PI * 2;
}
const chamberDustGeo = new THREE.BufferGeometry();
const chamberDustAttr = new THREE.BufferAttribute(chamberDustPos, 3);
chamberDustAttr.setUsage(THREE.DynamicDrawUsage);
chamberDustGeo.setAttribute('position', chamberDustAttr);
const chamberDustMat = new THREE.PointsMaterial({
  color: 0xbae6fd,
  map: dataPointSpriteTex,
  size: 0.045,
  transparent: true,
  opacity: 0.28,
  alphaTest: 0.01,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const chamberDust = new THREE.Points(chamberDustGeo, chamberDustMat);
chamberDust.frustumCulled = false;
scene.add(chamberDust);

function updateChamberDust(dt, activity = 1.0) {
  const arr = chamberDustAttr.array;
  const speed = (0.14 + activity * 0.1) * dt;
  for (let i = 0; i < chamberDustCount; i++) {
    const b = i * 3;
    const ph = chamberDustPhase[i] + dt * 1.1;
    chamberDustPhase[i] = ph;
    arr[b] += Math.sin(ph + i * 0.13) * 0.06 * dt;
    arr[b + 1] += speed;
    arr[b + 2] += Math.cos(ph * 0.8 + i * 0.19) * 0.06 * dt;
    if (arr[b + 1] > 2.95) arr[b + 1] = -1.95;
  }
  chamberDustAttr.needsUpdate = true;
}

function createBeveledTechPlateGeometry(w, h, depth) {
  const shape = new THREE.Shape();
  const hw = w * 0.5;
  const hh = h * 0.5;
  const ch = Math.min(w, h) * 0.18;
  shape.moveTo(-hw + ch, -hh);
  shape.lineTo(hw - ch, -hh);
  shape.lineTo(hw, -hh + ch);
  shape.lineTo(hw, hh - ch);
  shape.lineTo(hw - ch, hh);
  shape.lineTo(-hw + ch, hh);
  shape.lineTo(-hw, hh - ch);
  shape.lineTo(-hw, -hh + ch);
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelThickness: depth * 0.35,
    bevelSize: Math.min(w, h) * 0.04,
    bevelSegments: 2,
  });
  geo.center();
  return geo;
}

function createCodeLayerCanvas(accentHex) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(4, 7, 16, 0.18)';
  ctx.fillRect(0, 0, 1024, 512);
  ctx.font = 'bold 11px monospace';
  const tokens = [
    '0xA4F9::CLAUSE_VERIFY', 'RISK_EVAL => 0.841', 'AST_LEGAL_NODE[2.1]',
    'SHA3:99F1_QUANTUM', 'TRAP_GUARD_ACTIVE', 'WEIGHT_SIGMA:0.924',
    'MEM_BANK[4096x64]', 'AGENT_SYNC_STREAM()', 'SECUDEX_PROTOCOL_V9',
  ];
  for (let row = 0; row < 28; row++) {
    ctx.fillStyle = row % 4 === 0 ? accentHex : 'rgba(148, 163, 184, 0.62)';
    const line = `${tokens[row % tokens.length]}  // ${Math.random().toString(16).slice(2, 10).toUpperCase()}  [${(row * 17) % 99}]`;
    ctx.fillText(line, (row * 43) % 240, 14 + row * 18);
    ctx.fillText(line, ((row * 43) % 240) + 512, 14 + row * 18);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function createTechnosphere({ radius, position, accentColor, secondaryColor, label, isFlagship = false }) {
  const group = new THREE.Group();
  group.position.copy(position);
  scene.add(group);

  const accentHexStr = '#' + new THREE.Color(accentColor).getHexString();
  const armorMaps = createTechArmorMaps(accentHexStr);

  // 1. Внутреннее квантовое ядро (многогранный темный коллайдер + энергетический кристалл + силовой каркас)
  const coreGroup = new THREE.Group();
  const coreMat = new THREE.MeshStandardMaterial({
    color: 0x0f172a,
    emissive: accentColor,
    emissiveIntensity: 1.9,
    roughness: 0.14,
    metalness: 0.88,
    flatShading: true,
  });
  const coreMesh = new THREE.Mesh(new THREE.OctahedronGeometry(radius * 0.175, 1), coreMat);
  const coreCage = new THREE.Mesh(
    new THREE.IcosahedronGeometry(radius * 0.22, 0),
    new THREE.MeshStandardMaterial({
      color: 0x94a3b8, metalness: 0.94, roughness: 0.22, wireframe: true,
    })
  );
  const coreAura = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 0.28, 18, 14),
    new THREE.MeshBasicMaterial({
      color: accentColor, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false,
    })
  );
  coreGroup.add(coreMesh, coreCage);
  group.add(coreGroup, coreAura);

  // 2. Прецизионные гироскопические кольца переработки с захватами и оптическими шинами
  const procGroup = new THREE.Group();
  const gimbalBodyMat = new THREE.MeshPhysicalMaterial({
    color: 0x1e293b,
    metalness: 0.93,
    roughness: 0.22,
    normalMap: armorMaps.normalTex,
    normalScale: new THREE.Vector2(0.85, 0.85),
    clearcoat: 0.4,
    clearcoatRoughness: 0.2,
    envMapIntensity: 1.5,
  });
  const gimbalClampMat = new THREE.MeshStandardMaterial({
    color: 0x64748b,
    metalness: 0.95,
    roughness: 0.18,
  });
  const gimbalTrackMat = new THREE.MeshStandardMaterial({
    color: 0x0f172a,
    emissive: secondaryColor,
    emissiveIntensity: 1.25,
    metalness: 0.6,
    roughness: 0.2,
  });

  const rings = [];
  const clampGeo = new THREE.BoxGeometry(radius * 0.042, radius * 0.056, radius * 0.056);
  [0.35, 0.46, 0.57].forEach((rf, idx) => {
    const rGroup = new THREE.Group();
    const rRad = radius * rf;
    const baseTorus = new THREE.Mesh(new THREE.TorusGeometry(rRad, radius * 0.015, 10, 48), gimbalBodyMat);
    const optTrack = new THREE.Mesh(new THREE.TorusGeometry(rRad * 1.006, radius * 0.005, 6, 48), gimbalTrackMat);
    rGroup.add(baseTorus, optTrack);

    const clampCount = isFlagship ? 10 : 6;
    for (let c = 0; c < clampCount; c++) {
      const a = (c / clampCount) * Math.PI * 2;
      const clamp = new THREE.Mesh(clampGeo, gimbalClampMat);
      clamp.position.set(Math.cos(a) * rRad, Math.sin(a) * rRad, 0);
      clamp.rotation.z = a;
      rGroup.add(clamp);
    }

    rGroup.rotation.set(idx * 0.92, idx * 0.65, idx * 0.42);
    procGroup.add(rGroup);
    rings.push(rGroup);
  });
  group.add(procGroup);

  // 3. Структурированный поток данных (точечные LiDAR-узлы с плавной сменой x, y, z в реальном времени)
  const dataCount = isFlagship ? 340 : 140;
  const dPos = new Float32Array(dataCount * 3);
  const baseThetas = new Float32Array(dataCount);
  const basePhis = new Float32Array(dataCount);
  const baseScales = new Float32Array(dataCount);
  const latBands = isFlagship ? 10 : 6;
  const _streamPt = { x: 0, y: 0, z: 0 };
  let dataStreamPhase = 0;

  for (let i = 0; i < dataCount; i++) {
    const band = i % latBands;
    const theta = 0.35 + (band / (latBands - 1)) * (Math.PI - 0.7);
    const phi = (i / dataCount) * Math.PI * 18 + band * 0.7;
    const scale = 0.61 + (i % 3) * 0.045;
    baseThetas[i] = theta;
    basePhis[i] = phi;
    baseScales[i] = scale;
    computeDataStreamPoint(radius, theta, phi, scale, 0, i, _streamPt);
    dPos[i * 3] = _streamPt.x;
    dPos[i * 3 + 1] = _streamPt.y;
    dPos[i * 3 + 2] = _streamPt.z;
  }
  const dataGeo = new THREE.BufferGeometry();
  const dataPosAttr = new THREE.BufferAttribute(dPos, 3);
  dataPosAttr.setUsage(THREE.DynamicDrawUsage);
  dataGeo.setAttribute('position', dataPosAttr);
  const dataMat = new THREE.PointsMaterial({
    color: accentColor,
    map: dataPointSpriteTex,
    size: isFlagship ? 0.085 : 0.042,
    transparent: true,
    opacity: 0.92,
    alphaTest: 0.01,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const dataPoints = new THREE.Points(dataGeo, dataMat);
  dataPoints.frustumCulled = false;
  group.add(dataPoints);

  function updateDataPoints(dt, intensity = 1.0) {
    dataStreamPhase += dt * intensity;
    const arr = dataPosAttr.array;
    for (let i = 0; i < dataCount; i++) {
      computeDataStreamPoint(
        radius,
        baseThetas[i],
        basePhis[i],
        baseScales[i],
        dataStreamPhase,
        i,
        _streamPt,
      );
      const base = i * 3;
      arr[base] = _streamPt.x;
      arr[base + 1] = _streamPt.y;
      arr[base + 2] = _streamPt.z;
    }
    dataPosAttr.needsUpdate = true;
  }

  // 4. Внутренний слой микро-кода
  const codeTex = createCodeLayerCanvas(accentHexStr);
  const codeMat = new THREE.MeshBasicMaterial({
    map: codeTex,
    transparent: true,
    opacity: 0.56,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const codeSphere = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.76, 32, 22), codeMat);
  group.add(codeSphere);

  // 5. Закрытая техно-цифровая броня корпуса (сферические щиты + объемные скошенные пластины)
  const armorGroup = new THREE.Group();
  const hullCowlMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    map: armorMaps.colorTex,
    normalMap: armorMaps.normalTex,
    normalScale: new THREE.Vector2(isFlagship ? 1.45 : 1.15, isFlagship ? 1.45 : 1.15),
    roughnessMap: armorMaps.roughTex,
    roughness: 0.38,
    metalness: 0.89,
    clearcoat: 0.42,
    clearcoatRoughness: 0.22,
    iridescence: 0.22,
    iridescenceIOR: 1.45,
    specularIntensity: 1.0,
    envMapIntensity: 1.58,
    emissive: 0xffffff,
    emissiveMap: armorMaps.emissiveTex,
    emissiveIntensity: 0.88,
    side: THREE.DoubleSide,
  });

  const plateMat = new THREE.MeshPhysicalMaterial({
    color: 0xdbeafe,
    map: armorMaps.colorTex,
    normalMap: armorMaps.normalTex,
    normalScale: new THREE.Vector2(isFlagship ? 1.55 : 1.2, isFlagship ? 1.55 : 1.2),
    roughnessMap: armorMaps.roughTex,
    roughness: 0.30,
    metalness: 0.92,
    clearcoat: 0.56,
    clearcoatRoughness: 0.16,
    iridescence: 0.18,
    iridescenceIOR: 1.4,
    specularIntensity: 1.0,
    envMapIntensity: 1.65,
    emissive: 0xffffff,
    emissiveMap: armorMaps.emissiveTex,
    emissiveIntensity: 0.95,
  });

  const digitalModuleMat = new THREE.MeshStandardMaterial({
    color: 0x0b1322,
    map: armorMaps.colorTex,
    emissive: accentColor,
    emissiveMap: armorMaps.emissiveTex,
    emissiveIntensity: 1.25,
    metalness: 0.82,
    roughness: 0.22,
  });

  // Закрытые сферические бронекожухи (на главном ИИ — плотное многосекторное закрытие верха, низа, тыла и боков)
  const cowlScale = isFlagship ? 0.945 : 0.93;
  // Северный купол (оставляет узкий полярный порт для импульса)
  armorGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(radius * cowlScale, 36, 14, 0, Math.PI * 2, isFlagship ? 0.15 : 0.18, isFlagship ? 0.74 : 0.56),
    hullCowlMat
  ));
  // Южный бронекожух
  armorGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(radius * cowlScale, 36, 14, 0, Math.PI * 2, isFlagship ? 2.24 : 2.38, isFlagship ? 0.74 : 0.58),
    hullCowlMat
  ));
  // Тыловой и боковой закрытый корпус (оставляет фронтальный обзорный визор к камере +Z)
  const rearPhiStart = isFlagship ? Math.PI * 0.76 : Math.PI * 0.82;
  const rearPhiLen = isFlagship ? Math.PI * 1.48 : Math.PI * 1.36;
  armorGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(radius * cowlScale, 36, 18, rearPhiStart, rearPhiLen, 0.72, 1.70),
    hullCowlMat
  ));

  // Силовые меридианные и широтные бронекольца вокруг визора
  const structRingMat = new THREE.MeshPhysicalMaterial({
    color: 0x1e293b,
    metalness: 0.95,
    roughness: 0.19,
    normalMap: armorMaps.normalTex,
    normalScale: new THREE.Vector2(0.85, 0.85),
    clearcoat: 0.5,
    clearcoatRoughness: 0.16,
    envMapIntensity: 1.55,
  });
  const collarTop = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.79, radius * 0.022, 10, 48), structRingMat);
  collarTop.rotation.x = Math.PI / 2;
  collarTop.position.y = radius * 0.58;
  const collarBot = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.79, radius * 0.022, 10, 48), structRingMat);
  collarBot.rotation.x = Math.PI / 2;
  collarBot.position.y = -radius * 0.58;
  armorGroup.add(collarTop, collarBot);

  if (isFlagship) {
    // Полярная бронешахта-излучатель на северном полюсе главного ИИ
    const emitterCrown = new THREE.Mesh(
      new THREE.CylinderGeometry(radius * 0.16, radius * 0.24, radius * 0.12, 12, 1, true),
      structRingMat
    );
    emitterCrown.position.y = radius * 0.97;
    armorGroup.add(emitterCrown);

    // Боковые вертикальные ребра обрамления переднего оптического отсека
    [-0.78, 0.78].forEach(ry => {
      const arc = new THREE.Mesh(
        new THREE.TorusGeometry(radius * 0.97, radius * 0.02, 8, 48),
        structRingMat
      );
      arc.rotation.y = ry;
      armorGroup.add(arc);
    });
  }

  // Наложение объемных скошенных закрытых техно-цифровых пластин (InstancedMesh)
  const plateCandidates = [];
  const latSteps = isFlagship ? 8 : 5;
  for (let li = 0; li < latSteps; li++) {
    const tNorm = (li + 0.5) / latSteps;
    const theta = 0.22 + tNorm * (Math.PI - 0.44);
    const sinT = Math.sin(theta);
    const cosT = Math.cos(theta);
    const lonCount = Math.max(6, Math.round((isFlagship ? 14 : 8) * sinT));

    for (let lj = 0; lj < lonCount; lj++) {
      const phi = (lj / lonCount) * Math.PI * 2 + (li % 2) * (Math.PI / lonCount);
      const nx = sinT * Math.cos(phi);
      const ny = cosT;
      const nz = sinT * Math.sin(phi);

      // На главном ИИ плотно закрываем весь корпус, кроме фронтального оптического окна (nz > 0.56 и |ny| < 0.40)
      const inFrontAperture = isFlagship
        ? (nz > 0.56 && Math.abs(ny) < 0.40)
        : (nz > 0.44 && Math.abs(ny) < 0.52);

      if (!inFrontAperture) {
        plateCandidates.push({ nx, ny, nz, tier: (li + lj) % 2 });
      }
    }
  }

  const plateW = isFlagship ? radius * 0.34 : radius * 0.42;
  const plateH = isFlagship ? radius * 0.24 : radius * 0.29;
  const plateGeo = createBeveledTechPlateGeometry(plateW, plateH, radius * 0.032);
  const plateInst = new THREE.InstancedMesh(plateGeo, plateMat, plateCandidates.length);
  const modGeo = createBeveledTechPlateGeometry(plateW * 0.58, plateH * 0.38, radius * 0.018);
  const modCount = Math.ceil(plateCandidates.length * 0.65);
  const modInst = new THREE.InstancedMesh(modGeo, digitalModuleMat, modCount);

  const dummy = new THREE.Object3D();
  const cVar = new THREE.Color();
  const paletteTints = [0x94a3b8, 0xb8c7dc, 0x64748b, 0x7c93b3];

  let mIdx = 0;
  plateCandidates.forEach((pt, idx) => {
    const rPlace = radius * (pt.tier === 0 ? 0.975 : 1.005);
    dummy.position.set(pt.nx * rPlace, pt.ny * rPlace, pt.nz * rPlace);
    dummy.lookAt(pt.nx * rPlace * 2, pt.ny * rPlace * 2, pt.nz * rPlace * 2);
    const sc = pt.tier === 0 ? 1.0 : 0.92;
    dummy.scale.set(sc, sc, 1);
    dummy.updateMatrix();
    plateInst.setMatrixAt(idx, dummy.matrix);
    cVar.setHex(paletteTints[idx % paletteTints.length]);
    plateInst.setColorAt(idx, cVar);

    if (mIdx < modCount && (idx % 3 !== 1)) {
      const rMod = rPlace + radius * 0.022;
      dummy.position.set(pt.nx * rMod, pt.ny * rMod, pt.nz * rMod);
      dummy.lookAt(pt.nx * rMod * 2, pt.ny * rMod * 2, pt.nz * rMod * 2);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      modInst.setMatrixAt(mIdx, dummy.matrix);
      mIdx++;
    }
  });
  modInst.count = mIdx;
  plateInst.instanceMatrix.needsUpdate = true;
  if (plateInst.instanceColor) plateInst.instanceColor.needsUpdate = true;
  modInst.instanceMatrix.needsUpdate = true;
  plateInst.computeBoundingSphere();
  modInst.computeBoundingSphere();
  armorGroup.add(plateInst, modInst);
  group.add(armorGroup);

  // 6. Изменчивая оптическая проекция в окне визора и тонкая внешняя оболочка
  const projCanvas = document.createElement('canvas');
  projCanvas.width = isFlagship ? 1024 : 512;
  projCanvas.height = isFlagship ? 512 : 256;
  const projCtx = projCanvas.getContext('2d');
  const projTex = new THREE.CanvasTexture(projCanvas);
  projTex.colorSpace = THREE.SRGBColorSpace;
  projTex.wrapS = THREE.RepeatWrapping;
  projTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const outerMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    map: projTex,
    emissive: secondaryColor,
    emissiveMap: projTex,
    emissiveIntensity: 0.9,
    transparent: true,
    opacity: 0.56,
    roughness: 0.08,
    metalness: 0.25,
    clearcoat: 1.0,
    clearcoatRoughness: 0.06,
    ior: 1.76,
    envMapIntensity: 1.75,
    depthWrite: false,
    side: THREE.FrontSide,
  });

  outerMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.uniforms.uMorph = { value: 1.0 };
    shader.uniforms.uFresnelColor = { value: new THREE.Color(secondaryColor) };
    outerMat.userData.shader = shader;
    shader.vertexShader = 'uniform float uTime;\nuniform float uMorph;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      #include <begin_vertex>
      float wave = sin(position.x * 5.2 + uTime * 2.4) * cos(position.y * 4.8 - uTime * 1.9) * sin(position.z * 4.5 + uTime * 1.5);
      transformed += normal * (wave * ${(radius * 0.012).toFixed(4)} * uMorph);
      `
    );
    shader.fragmentShader = 'uniform vec3 uFresnelColor;\n' + shader.fragmentShader;
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <emissivemap_fragment>',
      `
      #include <emissivemap_fragment>
      float optFresnel = pow(1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0), 2.8);
      totalEmissiveRadiance += uFresnelColor * (optFresnel * 0.72);
      `
    );
  };

  const outerShell = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 0.96, isFlagship ? 40 : 24, isFlagship ? 28 : 18),
    outerMat
  );
  outerShell.rotation.y = -Math.PI / 2;
  group.add(outerShell);

  // Тонкий темный титановый силовой каркас поверх сферы
  const wireMat = new THREE.MeshBasicMaterial({
    color: 0x334155,
    wireframe: true,
    transparent: true,
    opacity: 0.16,
  });
  const wireShell = new THREE.Mesh(new THREE.IcosahedronGeometry(radius * 1.025, isFlagship ? 3 : 2), wireMat);
  group.add(wireShell);

  // 7. Светящееся кольцо данных вокруг сферы
  const dataRingGroup = new THREE.Group();
  dataRingGroup.rotation.set(0.28, 0, -0.14);

  const ringBandCanvas = document.createElement('canvas');
  ringBandCanvas.width = 1024;
  ringBandCanvas.height = 128;
  const rbCtx = ringBandCanvas.getContext('2d');
  rbCtx.clearRect(0, 0, 1024, 128);
  for (let x = 0; x < 1024; x += 16) {
    const tall = x % 64 === 0 ? 52 : (x % 32 === 0 ? 34 : 18);
    rbCtx.fillStyle = x % 64 === 0 ? '#ffffff' : accentHexStr;
    rbCtx.fillRect(x, 64 - tall * 0.5, 6, tall);
  }
  rbCtx.strokeStyle = accentHexStr;
  rbCtx.lineWidth = 3;
  rbCtx.beginPath();
  rbCtx.moveTo(0, 20); rbCtx.lineTo(1024, 20);
  rbCtx.moveTo(0, 108); rbCtx.lineTo(1024, 108);
  rbCtx.stroke();
  rbCtx.fillStyle = '#e0f2fe';
  rbCtx.font = 'bold 14px monospace';
  for (let s = 0; s < 4; s++) {
    rbCtx.fillText(`DATA_BUS::0${s + 1} // SYNC_OK`, 28 + s * 256, 15);
  }

  const dataRingTex = new THREE.CanvasTexture(ringBandCanvas);
  dataRingTex.colorSpace = THREE.SRGBColorSpace;
  dataRingTex.wrapS = THREE.RepeatWrapping;
  dataRingTex.repeat.set(isFlagship ? 3 : 2, 1);
  dataRingTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const dataRingR = radius * (isFlagship ? 1.24 : 1.28);
  const dataRingBandMat = new THREE.MeshBasicMaterial({
    map: dataRingTex,
    color: accentColor,
    transparent: true,
    opacity: isFlagship ? 0.85 : 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const dataRingBand = new THREE.Mesh(
    new THREE.CylinderGeometry(dataRingR, dataRingR, radius * (isFlagship ? 0.16 : 0.18), 64, 1, true),
    dataRingBandMat
  );
  const dataRingCoreMat = new THREE.MeshBasicMaterial({
    color: accentColor,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const dataRingCore = new THREE.Mesh(
    new THREE.TorusGeometry(dataRingR, radius * 0.011, 8, 72),
    dataRingCoreMat
  );
  dataRingCore.rotation.x = Math.PI / 2;
  dataRingGroup.add(dataRingBand, dataRingCore);
  group.add(dataRingGroup);

  // 8. Динамическая голографическая проекция вердикта над сферой (CanvasTexture)
  const verdictHoloGroup = new THREE.Group();
  verdictHoloGroup.position.set(0, radius * 1.74, 0.45);
  verdictHoloGroup.visible = false;

  const verdictCanvas = document.createElement('canvas');
  verdictCanvas.width = 1024;
  verdictCanvas.height = 384;
  const verdictCtx = verdictCanvas.getContext('2d');
  const verdictTex = new THREE.CanvasTexture(verdictCanvas);
  verdictTex.colorSpace = THREE.SRGBColorSpace;
  verdictTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const verdictHoloMat = new THREE.MeshBasicMaterial({
    map: verdictTex,
    transparent: true,
    opacity: 0.96,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const verdictHoloPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(radius * 2.5, radius * 0.92),
    verdictHoloMat
  );
  const verdictConeMat = new THREE.MeshBasicMaterial({
    color: 0xff3b5c,
    transparent: true,
    opacity: 0.1,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const verdictCone = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.52, radius * 0.14, radius * 0.56, 24, 1, true),
    verdictConeMat
  );
  verdictCone.position.set(0, -radius * 0.68, -0.35);
  verdictHoloGroup.add(verdictCone, verdictHoloPlane);
  group.add(verdictHoloGroup);

  function updateVerdictHologram(visible, percentText = '84%', elapsed = 0, threatCount = 5) {
    verdictHoloGroup.visible = visible;
    if (!visible) return;

    const w = verdictCanvas.width;
    const h = verdictCanvas.height;
    verdictCtx.clearRect(0, 0, w, h);

    const pulse = 0.72 + Math.sin(elapsed * 8) * 0.28;
    // Фон голографической панели
    const bgGrad = verdictCtx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, 'rgba(30, 8, 20, 0.72)');
    bgGrad.addColorStop(0.5, 'rgba(48, 8, 24, 0.86)');
    bgGrad.addColorStop(1, 'rgba(20, 6, 16, 0.72)');
    verdictCtx.fillStyle = bgGrad;
    verdictCtx.fillRect(36, 26, w - 72, h - 52);

    // Горизонтальные голографические скан-линии и бегущая полоса
    verdictCtx.fillStyle = 'rgba(255, 77, 109, 0.08)';
    for (let y = 32; y < h - 32; y += 8) {
      verdictCtx.fillRect(40, y, w - 80, 2);
    }
    const sweepY = 30 + ((elapsed * 180) % (h - 60));
    verdictCtx.fillStyle = `rgba(255, 130, 150, ${(0.28 * pulse).toFixed(2)})`;
    verdictCtx.fillRect(40, sweepY, w - 80, 10);

    // Угловые силовые скобки голограммы
    verdictCtx.strokeStyle = `rgba(255, 77, 109, ${pulse.toFixed(2)})`;
    verdictCtx.lineWidth = 6;
    const bx0 = 36, bx1 = w - 36, by0 = 26, by1 = h - 26, br = 42;
    verdictCtx.beginPath();
    verdictCtx.moveTo(bx0, by0 + br); verdictCtx.lineTo(bx0, by0); verdictCtx.lineTo(bx0 + br, by0);
    verdictCtx.moveTo(bx1 - br, by0); verdictCtx.lineTo(bx1, by0); verdictCtx.lineTo(bx1, by0 + br);
    verdictCtx.moveTo(bx0, by1 - br); verdictCtx.lineTo(bx0, by1); verdictCtx.lineTo(bx0 + br, by1);
    verdictCtx.moveTo(bx1 - br, by1); verdictCtx.lineTo(bx1, by1); verdictCtx.lineTo(bx1, by1 - br);
    verdictCtx.stroke();

    // Верхняя строка статуса
    verdictCtx.textAlign = 'center';
    verdictCtx.textBaseline = 'middle';
    verdictCtx.fillStyle = '#fda4af';
    verdictCtx.font = 'bold 26px monospace';
    verdictCtx.fillText(`ГОЛОГРАФИЧЕСКИЙ ВЕРДИКТ SECUDEX • УГРОЗ: ${threatCount}/5`, w / 2, 76);

    // Крупный процент и вердикт
    verdictCtx.fillStyle = '#ff4d6d';
    verdictCtx.font = '900 124px Arial, sans-serif';
    verdictCtx.fillText(percentText, w / 2, 198);

    verdictCtx.fillStyle = '#ffffff';
    verdictCtx.font = '900 32px Arial, sans-serif';
    verdictCtx.fillText('КРИТИЧЕСКИЙ УРОВЕНЬ ЮРИДИЧЕСКОГО РИСКА', w / 2, 310);

    verdictTex.needsUpdate = true;
    verdictHoloGroup.position.y = radius * (1.74 + Math.sin(elapsed * 3.2) * 0.02);
  }

  function updateProjection(mode, statusText, percentText) {
    const w = projCanvas.width, h = projCanvas.height;
    projCtx.clearRect(0, 0, w, h);

    // Прецизионная калибровочная сетка визора
    projCtx.strokeStyle = mode === 'powerdown'
      ? 'rgba(30, 41, 59, 0.25)'
      : (mode === 'verdict' ? 'rgba(255, 59, 92, 0.45)' : 'rgba(56, 189, 248, 0.24)');
    projCtx.lineWidth = 1;
    for (let x = w * 0.25; x <= w * 0.75; x += w / 24) {
      projCtx.beginPath(); projCtx.moveTo(x, h * 0.22); projCtx.lineTo(x, h * 0.78); projCtx.stroke();
    }
    for (let y = h * 0.25; y <= h * 0.75; y += h / 12) {
      projCtx.beginPath(); projCtx.moveTo(w * 0.25, y); projCtx.lineTo(w * 0.75, y); projCtx.stroke();
    }

    if (mode === 'powerdown') {
      dataRingBandMat.opacity = 0.08;
      dataRingCoreMat.opacity = 0.1;
      projTex.needsUpdate = true;
      return;
    }

    if (mode === 'verdict' && isFlagship) {
      dataRingBandMat.color.setHex(0xff3b5c);
      dataRingCoreMat.color.setHex(0xff6b81);
      dataRingBandMat.opacity = 0.95;
      dataRingCoreMat.opacity = 0.95;

      // Резкая, монументальная проекция вердикта в процентах по центру переднего визора флагмана
      projCtx.fillStyle = 'rgba(28, 4, 14, 0.84)';
      projCtx.fillRect(w * 0.31, h * 0.28, w * 0.38, h * 0.44);
      projCtx.strokeStyle = '#ff3b5c';
      projCtx.lineWidth = 4;
      projCtx.strokeRect(w * 0.31, h * 0.28, w * 0.38, h * 0.44);

      projCtx.textAlign = 'center';
      projCtx.textBaseline = 'middle';
      projCtx.fillStyle = '#fecdd3';
      projCtx.font = '900 22px monospace';
      projCtx.fillText('ВЕРДИКТ ИИ • РИСК', w / 2, h * 0.38);

      projCtx.fillStyle = '#ff4d6d';
      projCtx.font = '900 104px Arial, sans-serif';
      projCtx.fillText(percentText || '84%', w / 2, h * 0.56);
    } else {
      dataRingBandMat.color.setHex(accentColor);
      dataRingCoreMat.color.setHex(accentColor);
      dataRingBandMat.opacity = isFlagship ? 0.85 : 0.72;
      dataRingCoreMat.opacity = 0.9;

      // Тонкая тактическая проекция телеметрии внутри оптического визора
      const tNow = performance.now() * 0.0022;
      projCtx.strokeStyle = mode === 'scan' ? '#fb7185' : '#38bdf8';
      projCtx.lineWidth = isFlagship ? 2.2 : 1.5;
      projCtx.beginPath();
      for (let x = w * 0.3; x <= w * 0.7; x += 6) {
        const env = Math.sin(((x - w * 0.3) / (w * 0.4)) * Math.PI);
        const y = h * 0.5 + (Math.sin(x * 0.05 + tNow * 2) * (h * 0.11) + Math.cos(x * 0.12 - tNow * 3) * (h * 0.04)) * env;
        if (x === w * 0.3) projCtx.moveTo(x, y); else projCtx.lineTo(x, y);
      }
      projCtx.stroke();

      // Угловые прицельные скобки визора
      projCtx.strokeStyle = 'rgba(148, 163, 184, 0.65)';
      projCtx.lineWidth = 2;
      const bx0 = w * 0.33, bx1 = w * 0.67, by0 = h * 0.31, by1 = h * 0.69, br = 16;
      projCtx.beginPath();
      projCtx.moveTo(bx0, by0 + br); projCtx.lineTo(bx0, by0); projCtx.lineTo(bx0 + br, by0);
      projCtx.moveTo(bx1 - br, by0); projCtx.lineTo(bx1, by0); projCtx.lineTo(bx1, by0 + br);
      projCtx.moveTo(bx0, by1 - br); projCtx.lineTo(bx0, by1); projCtx.lineTo(bx0 + br, by1);
      projCtx.moveTo(bx1 - br, by1); projCtx.lineTo(bx1, by1); projCtx.lineTo(bx1, by1 - br);
      projCtx.stroke();

      projCtx.fillStyle = '#e2e8f0';
      projCtx.textAlign = 'center';
      projCtx.font = `700 ${isFlagship ? 20 : 14}px monospace`;
      projCtx.fillText(label, w / 2, h * 0.37);

      projCtx.fillStyle = mode === 'scan' ? '#fda4af' : '#7dd3fc';
      projCtx.font = `700 ${isFlagship ? 17 : 12}px monospace`;
      projCtx.fillText(statusText || 'ONLINE // MATRIX', w / 2, h * 0.64);
    }
    projTex.needsUpdate = true;
  }

  updateProjection('idle', 'STANDBY // CORE LOCKED');

  return {
    group,
    coreMesh,
    coreCage,
    coreMat,
    rings,
    dataPoints,
    dataMat,
    updateDataPoints,
    codeSphere,
    codeTex,
    outerShell,
    outerMat,
    wireShell,
    wireMat,
    dataRingGroup,
    dataRingTex,
    dataRingBandMat,
    dataRingCoreMat,
    verdictHoloGroup,
    updateVerdictHologram,
    armorMats: [hullCowlMat, plateMat, digitalModuleMat, gimbalTrackMat],
    projTex,
    updateProjection,
    radius,
  };
}

  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    const v = 112 + Math.floor(Math.random() * 34);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 5, 1);
  }
  return heightCanvasToNormalTex(c, 0.48, 4, 5);
}
const paperNormalTex = createPaperNormalTex();

function createPageEdgesTex() {

  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ede6d6';
  ctx.fillRect(0, 0, 96, 128);
  for (let x = 2; x < 96; x += 5) {
    ctx.fillStyle = x % 10 === 0 ? '#78716c' : '#faf6ed';

  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

}

const pageCanvas = document.createElement('canvas');

function drawContractPage(pageData) {
  const w = pageCanvas.width, h = pageCanvas.height;
  const grad = pageCtx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#fffdf9');
  grad.addColorStop(0.55, '#f6f2e8');
  grad.addColorStop(1, '#eae2d2');
  pageCtx.fillStyle = grad;
  pageCtx.fillRect(0, 0, w, h);

  // Микротекстура бумаги и диагональный водяной знак SECUDEX
  pageCtx.save();
  pageCtx.translate(w / 2, h / 2);
  pageCtx.rotate(-0.55);
  pageCtx.fillStyle = 'rgba(30, 58, 138, 0.05)';
  pageCtx.font = '900 108px Arial, sans-serif';
  pageCtx.textAlign = 'center';
  pageCtx.fillText('SECUDEX AUDIT', 0, -140);
  pageCtx.fillText('884-СД // LEGAL', 0, 160);
  pageCtx.restore();

  // Двойная нотариальная рамка и верхняя шапка документа
  pageCtx.strokeStyle = '#1e293b';
  pageCtx.lineWidth = 4;
  pageCtx.strokeRect(42, 42, w - 84, h - 84);
  pageCtx.lineWidth = 1.5;
  pageCtx.strokeRect(54, 54, w - 108, h - 108);

  // Правая закладка номера страницы (визуальный маркер многостраничности)
  const tabY = 180 + (pageData.pageNum - 1) * 185;
  pageCtx.fillStyle = '#1e293b';
  pageCtx.fillRect(w - 64, tabY, 64, 132);
  pageCtx.fillStyle = '#38bdf8';
  pageCtx.fillRect(w - 64, tabY, 6, 132);
  pageCtx.save();
  pageCtx.translate(w - 30, tabY + 66);
  pageCtx.rotate(-Math.PI / 2);
  pageCtx.fillStyle = '#f8fafc';
  pageCtx.font = 'bold 20px monospace';
  pageCtx.textAlign = 'center';
  pageCtx.textBaseline = 'middle';
  pageCtx.fillText(`ЛИСТ 0${pageData.pageNum}`, 0, 0);
  pageCtx.restore();

  // Верификационный матричный штрихкод справа сверху
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 6; c++) {
      if ((r * 7 + c * 3 + pageData.pageNum) % 2 === 0) {
        pageCtx.fillStyle = '#1e293b';
        pageCtx.fillRect(w - 154 + c * 12, 74 + r * 12, 9, 9);
      }
    }
  }
  pageCtx.fillStyle = '#475569';
  pageCtx.font = 'bold 14px monospace';
  pageCtx.textAlign = 'left';
  pageCtx.fillText(`DOC:884-P${pageData.pageNum}`, 78, 92);

  pageCtx.fillStyle = '#0f172a';
  pageCtx.textAlign = 'center';
  pageCtx.font = 'bold 34px Georgia, serif';
  pageCtx.fillText(pageData.header, w / 2 - 12, 148);

  pageCtx.font = 'italic 22px Georgia, serif';
  pageCtx.fillStyle = '#475569';
  pageCtx.fillText(`Реестр SECUDEX • Экземпляр № 884-СД • Страница ${pageData.pageNum} из ${CONTRACT_PAGES.length}`, w / 2 - 12, 194);

  pageCtx.strokeStyle = 'rgba(30, 41, 59, 0.32)';
  pageCtx.lineWidth = 2;
  pageCtx.beginPath();
  pageCtx.moveTo(84, 224); pageCtx.lineTo(w - 104, 224);
  pageCtx.stroke();

  pageCtx.textAlign = 'left';
  const bodyLines = [
    '§ 1. ОБЩИЕ ПОЛОЖЕНИЯ И ЗАЩИТНЫЙ КОНТУР:',
    'Настоящий лист договора передаётся в многослойный контур верификации для извлечения юридических, финансовых и арбитражных обязательств.',
    '',
    `§ 2. КЛЮЧЕВОЙ ПУНКТ (${pageData.riskCode}):`,
    pageData.clause,
    '',
    '§ 3. ПОРЯДОК ИСПОЛНЕНИЯ И РЕГЛАМЕНТ ОТВЕТСТВЕННОСТИ:',
    'Обязательства сторон скрепляются криптографическим слепком и подлежат проверке ИИ-агентами первого уровня перед передачей флагманскому контуру.',
  ];
  let y = 280;
  bodyLines.forEach((line, idx) => {
    const isRiskTitle = idx === 3;
    const isRiskBody = idx === 4;
    const isSectionHead = idx === 0 || idx === 6;
    pageCtx.font = (isRiskTitle || isRiskBody || isSectionHead)
      ? 'bold 25px Georgia, serif'
      : '23px Georgia, serif';
    pageCtx.fillStyle = isRiskTitle ? '#be123c' : (isSectionHead ? '#0f172a' : '#1e293b');
    const words = line.split(' ');
    let cur = '';
    for (const word of words) {
      if ((cur + word).length > 48) {
        pageCtx.fillText(cur.trim(), 86, y);
        cur = word + ' ';
        y += 36;
      } else {
        cur += word + ' ';
      }
    }
    if (cur.trim()) pageCtx.fillText(cur.trim(), 86, y);
    y += line ? 44 : 22;
  });

  // Выделенная плашка риска на самой странице
  pageCtx.fillStyle = 'rgba(225, 29, 72, 0.11)';
  pageCtx.strokeStyle = 'rgba(225, 29, 72, 0.65)';
  pageCtx.lineWidth = 3;
  pageCtx.fillRect(82, 836, w - 180, 158);
  pageCtx.strokeRect(82, 836, w - 180, 158);
  pageCtx.fillStyle = '#9f1239';
  pageCtx.font = 'bold 23px monospace';
  pageCtx.fillText(`ИИ-ДЕТЕКТОР УГРОЗ • ${pageData.riskCode} • [${pageData.severity}]`, 108, 886);
  pageCtx.fillStyle = '#0f172a';
  pageCtx.font = 'bold 25px Arial, sans-serif';
  pageCtx.fillText(pageData.riskText, 108, 940);

  // Зубчатая синяя нотариальная печать и живая подпись
  pageCtx.save();
  pageCtx.translate(245, 1215);
  pageCtx.strokeStyle = 'rgba(29, 78, 216, 0.85)';
  pageCtx.lineWidth = 4.5;
  pageCtx.beginPath(); pageCtx.arc(0, 0, 84, 0, Math.PI * 2); pageCtx.stroke();

function createBlurredLawyerWindow() {
  const winGroup = new THREE.Group();
  winGroup.position.set(0, 62, -38);
  winGroup.visible = false;

  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 640;
  const ctx = c.getContext('2d');

  // Глубокий темно-синий фон кабинета за окном экрана
  const bg = ctx.createRadialGradient(512, 320, 40, 512, 320, 540);
  bg.addColorStop(0, '#1e3a5f');
  bg.addColorStop(0.55, '#0f172a');
  bg.addColorStop(1, '#020617');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1024, 640);

  // Мягкое боке / эффект глубины резкости на лице юриста за экраном
  ctx.save();
  ctx.filter = 'blur(14px)';

  // Плечи и воротник пиджака
  ctx.fillStyle = '#0b1120';
  ctx.beginPath();
  ctx.ellipse(512, 620, 260, 190, 0, Math.PI, 0);
  ctx.fill();

  // Воротник рубашки
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath();
  ctx.moveTo(430, 470); ctx.lineTo(512, 560); ctx.lineTo(594, 470);
  ctx.closePath();
  ctx.fill();

  // Лицо, подсвеченное синим светом монитора
  const faceGrad = ctx.createRadialGradient(512, 290, 25, 512, 310, 170);
  faceGrad.addColorStop(0, '#bae6fd');
  faceGrad.addColorStop(0.55, '#64748b');
  faceGrad.addColorStop(1, '#1e293b');
  ctx.fillStyle = faceGrad;
  ctx.beginPath();
  ctx.ellipse(512, 300, 102, 134, 0, 0, Math.PI * 2);
  ctx.fill();

  // Прическа
  ctx.fillStyle = '#090d16';
  ctx.beginPath();
  ctx.ellipse(512, 196, 108, 56, 0, Math.PI, 0);
  ctx.fill();

  // Блики на очках от экрана
  ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
  ctx.lineWidth = 6;
  ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
  ctx.fillRect(435, 272, 64, 34);
  ctx.strokeRect(435, 272, 64, 34);
  ctx.fillRect(525, 272, 64, 34);
  ctx.strokeRect(525, 272, 64, 34);

  // Мягкое свечение монитора между зрителем и юристом
  const glow = ctx.createRadialGradient(512, 330, 30, 512, 330, 340);
  glow.addColorStop(0, 'rgba(125, 211, 252, 0.35)');
  glow.addColorStop(1, 'rgba(56, 189, 248, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, 1024, 640);
  ctx.restore();

  // Тонкий интерфейс/код на стекле со стороны юриста
  ctx.strokeStyle = 'rgba(125, 211, 252, 0.45)';
  ctx.lineWidth = 3;
  ctx.strokeRect(24, 24, 976, 592);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const screenPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(10.5, 6.56),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.96 })
  );

    new THREE.EdgesGeometry(new THREE.BoxGeometry(11.15, 7.15, 0.32)),
    new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.75 })
  );
  winGroup.add(frameBox, screenPlane, rim);
  scene.add(winGroup);
  return winGroup;
}

function syncUI() {
  document.body.setAttribute('data-stage', state.stage);
  document.body.setAttribute('data-threats', String(state.threatsExtracted));
  threatCountEl.textContent = `УГРОЗ: ${state.threatsExtracted} / ${CONTRACT_PAGES.length}`;

  const activeSlide = getSlideGroup(state.stage);
  document.querySelectorAll('.slide-btn').forEach(btn => {
    btn.classList.toggle('active', `slide-${btn.getAttribute('data-slide')}` === activeSlide);
  });

  const nextAct = getNextUserAction(state.stage);
  if (nextAct) {
    primaryBtn.disabled = false;
    primaryBtn.textContent = nextAct.label;
  } else {
    primaryBtn.disabled = true;
    primaryBtn.textContent = 'ИДЕТ ПРОЦЕСС...';
  }

  pauseBtn.disabled = !(state.stage === STAGES.SCAN);
  pauseBtn.textContent = state.paused ? 'Продолжить скан' : 'Пауза скана';

  const stageNames = {
    [STAGES.INTRO]: 'Обзор пространства',
    [STAGES.SCAN]: `Этап 1: Скан страницы ${state.pageIndex + 1}/${CONTRACT_PAGES.length}`,
    [STAGES.SCAN_PAUSED]: 'Пауза скана — готов к передаче',

    [STAGES.VERDICT]: 'Вердикт: Критический риск 84%',

    [STAGES.BEAM_ASCENT]: 'Импульс вверх — полёт камеры',

    [STAGES.COLLAPSE]: 'Свёртывание контура',

  polarBeamGroup.visible = false;
  lawyerWindow.visible = false;
  agentScanBeam.visible = false;
  packetGroup.visible = false;
  scanBarMat.opacity = 0;
  scanCoreMat.opacity = 0;
  scanLight.intensity = 0;
  fannedSheets.forEach(sh => { sh.visible = true; });
  transferStreams.forEach(s => {
    s.tube.visible = false;
    s.capsules.forEach(c => { c.visible = false; });
  });
  camera.up.set(0, 1, 0);
  camera.fov = 48;
  camera.updateProjectionMatrix();

  // Восстановление освещения после возможного обесточивания
  hemiLight.intensity = 0.9;
  keyLight.intensity = 2.3;
  rimLight.intensity = 1.8;
  bottomLight.intensity = 3.8;
  flagshipLight.color.setHex(0x38bdf8);
  flagshipLight.intensity = 5.5;
  flagshipSphere.coreMat.emissiveIntensity = 1.9;
  flagshipSphere.outerMat.emissiveIntensity = 0.9;
  flagshipSphere.armorMats?.forEach((m, idx) => { m.emissiveIntensity = idx === 2 || idx === 3 ? 1.25 : 0.9; });
  flagshipSphere.updateVerdictHologram(false);
  flagshipSphere.dataRingBandMat.opacity = 0.85;
  flagshipSphere.dataRingCoreMat.opacity = 0.9;
  electrodeGlowMat.emissiveIntensity = 1.65;
  violetAccentMat.emissiveIntensity = 0.95;
  cubeReactorArmorMat.emissiveIntensity = 0.95;
  agentSpheres.forEach(a => {
    a.coreMat.emissiveIntensity = 1.9;
    a.outerMat.emissiveIntensity = 0.9;
    a.armorMats?.forEach((m, idx) => { m.emissiveIntensity = idx === 2 || idx === 3 ? 1.25 : 0.9; });
    a.updateVerdictHologram(false);
    a.dataRingBandMat.opacity = 0.72;
    a.dataRingCoreMat.opacity = 0.9;
  });

  if (targetStage === STAGES.INTRO) {
    introZoomSettled = hasPlayedStartupIntro;
    state.threatsExtracted = 0;
    state.pageIndex = 0;
    riskListEl.innerHTML = '';
    riskHintEl.style.display = 'block';
    riskHintEl.textContent = 'Нажмите «ЗАПУСТИТЬ АНАЛИЗ» для старта сканирования договора';
    drawContractPage(CONTRACT_PAGES[0]);
    contractPivot.position.set(0, 0.1, 0.15);
    flagshipSphere.updateProjection('idle', 'STANDBY // GLOBAL AI');
    agentSpheres.forEach((a, i) => a.updateProjection('idle', `АГЕНТ-0${i + 1} // ГОТОВ`));
  }
}

function enterStage(nextStage, triggerAudioKey = null) {
  // Стартовая анимация квадрокоптера/приближения проигрывается только один раз при запуске
  hasPlayedStartupIntro = true;
  state.stage = nextStage;
  state.stageTimer = 0;
  state.paused = false;
  resetVisualsForStage(nextStage);

  if (nextStage === STAGES.SCAN) {
    state.pageIndex = 0;
    state.pageTimer = 0;
    state.threatsExtracted = 0;
    riskListEl.innerHTML = '';
    riskHintEl.style.display = 'none';
    drawContractPage(CONTRACT_PAGES[0]);
    fannedSheets.forEach(sh => { sh.visible = true; });
    controls.enabled = true;
  } else if (nextStage === STAGES.TRANSFER) {
    // Если перепрыгнули сразу на слайд передачи — заполним все 5 рисков
    if (state.threatsExtracted === 0) {
      CONTRACT_PAGES.forEach(p => appendRiskCard(p));
    }
    flagshipSphere.updateProjection('idle', 'RECEIVING REPORTS...');
  } else if (nextStage === STAGES.ANALYSIS) {
    flagshipSphere.updateProjection('scan', 'DEEP SYNTHESIS // 5 PAGES');
  } else if (nextStage === STAGES.VERDICT) {
    flagshipSphere.updateProjection('verdict', '', '84%');
    flagshipSphere.updateVerdictHologram(true, '84%', 0, state.threatsExtracted || CONTRACT_PAGES.length);
  } else if (nextStage === STAGES.POWERDOWN) {
    flagshipSphere.updateProjection('powerdown');
    flagshipSphere.updateVerdictHologram(false);
    agentSpheres.forEach(a => a.updateProjection('powerdown'));
  } else if (nextStage === STAGES.BEAM_ASCENT) {
    polarBeamGroup.visible = true;
    lawyerWindow.visible = true;
    controls.enabled = false;
  } else if (nextStage === STAGES.WINDOW_FOCUS) {
    polarBeamGroup.visible = true;
    lawyerWindow.visible = true;
    controls.enabled = false;
  } else if (nextStage === STAGES.WINDOW_RUSH) {
    polarBeamGroup.visible = true;
    lawyerWindow.visible = true;
    speedStreaksGroup.visible = true;
    controls.enabled = false;
  } else if (nextStage === STAGES.COLLAPSE) {
    lawyerWindow.visible = true;
    controls.enabled = false;
  } else if (nextStage === STAGES.LOGO_REVEAL) {
    finalLogoScreen.classList.add('visible');
    controls.enabled = false;
  } else {
    controls.enabled = true;
  }

  if (triggerAudioKey) playVoiceTrack(triggerAudioKey);
  syncUI();
}
